<div class="slider-compare" style="--slider-compare-v:0.5">
  <div aria-hidden="true">
    <div class="slider-compare__layer slider-compare__layer--before">
      <div class="slider-compare__bar">
        <span class="slider-compare__dot"></span>
        <span class="slider-compare__line" style="width:40px"></span>
        <span class="slider-compare__line" style="width:24px;margin-left:auto"></span>
      </div>
      <div class="slider-compare__body">
        <span class="slider-compare__img"></span>
        <span class="slider-compare__copy">
          <span class="slider-compare__line slider-compare__head" style="width:90%"></span>
          <span class="slider-compare__line" style="width:100%"></span>
          <span class="slider-compare__line" style="width:70%"></span>
          <span class="slider-compare__btn"></span>
        </span>
      </div>
      <span class="slider-compare__tag">BEFORE</span>
    </div>
    <div class="slider-compare__layer slider-compare__layer--after">
      <div class="slider-compare__bar">
        <span class="slider-compare__dot"></span>
        <span class="slider-compare__line" style="width:40px"></span>
        <span class="slider-compare__line" style="width:24px;margin-left:auto"></span>
      </div>
      <div class="slider-compare__body">
        <span class="slider-compare__img"></span>
        <span class="slider-compare__copy">
          <span class="slider-compare__line slider-compare__head" style="width:90%"></span>
          <span class="slider-compare__line" style="width:100%"></span>
          <span class="slider-compare__line" style="width:70%"></span>
          <span class="slider-compare__btn"></span>
        </span>
      </div>
      <span class="slider-compare__tag">AFTER</span>
    </div>
    <span class="slider-compare__divider">
      <span class="slider-compare__handle"></span>
    </span>
  </div>
  <input class="slider-compare__input" type="range" min="0" max="100" aria-label="Compare before and after" aria-valuetext="50 percent after" value="50"/>
</div>
