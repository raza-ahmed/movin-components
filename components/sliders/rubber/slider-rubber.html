        <g transform="rotate(49.5)">
          <circle r="4.2" fill="currentColor"></circle>
          <line x1="0" y1="-6.6" x2="0" y2="-9.05" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" transform="rotate(0)"></line>
