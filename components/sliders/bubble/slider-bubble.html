<div class="slider-bubble" style="--slider-bubble-v:0.42;--slider-bubble-tilt:0deg;--slider-bubble-s:1">
  <div class="slider-bubble__track">
    <span class="slider-bubble__rail"></span>
    <span class="slider-bubble__fill"></span>
    <span class="slider-bubble__thumb"></span>
    <span class="slider-bubble__tip" aria-hidden="true">
      <span class="slider-bubble__lean">42</span>
    </span>
    <input class="slider-bubble__input" type="range" min="0" max="100" aria-label="Opacity" value="42"/>
  </div>
</div>
