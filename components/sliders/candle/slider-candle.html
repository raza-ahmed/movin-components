<div class="slider-candle" style="--slider-candle-v:0.25">
  <div class="slider-candle__stand" aria-hidden="true">
    <span class="slider-candle__glow"></span>
    <span class="slider-candle__wax">
      <span class="slider-candle__flame"></span>
      <span class="slider-candle__drip" style="left:3px;--len:22px"></span>
      <span class="slider-candle__drip" style="right:6px;--len:14px"></span>
      <span class="slider-candle__drip" style="left:13px;--len:8px"></span>
    </span>
    <span class="slider-candle__dish"></span>
  </div>
  <span class="slider-candle__read" aria-hidden="true"><b>6 h</b> of light left</span>
  <div class="slider-candle__track">
    <span class="slider-candle__rail"></span>
    <span class="slider-candle__fill"></span>
    <span class="slider-candle__thumb"></span>
    <input class="slider-candle__input" type="range" min="0" max="8" step="0.5" aria-label="Hours burned" aria-valuetext="6 hours left" value="2"/>
  </div>
</div>
