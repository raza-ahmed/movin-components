<div class="slider-grow" style="--slider-grow-v:0.6">
  <span class="slider-grow__pot" aria-hidden="true">
    <span class="slider-grow__stem"></span>
    <span class="slider-grow__leaf slider-grow__leaf--r" style="--h:14;--r:-20deg"></span>
    <span class="slider-grow__leaf slider-grow__leaf--l" style="--h:30;--r:20deg"></span>
    <span class="slider-grow__leaf slider-grow__leaf--r" style="--h:48;--r:-30deg"></span>
    <span class="slider-grow__leaf slider-grow__leaf--l" style="--h:64;--r:30deg"></span>
    <span class="slider-grow__flower">
      <span class="slider-grow__petal" style="--a:0deg"></span>
      <span class="slider-grow__petal" style="--a:72deg"></span>
      <span class="slider-grow__petal" style="--a:144deg"></span>
      <span class="slider-grow__petal" style="--a:216deg"></span>
      <span class="slider-grow__petal" style="--a:288deg"></span>
      <span class="slider-grow__heart"></span>
    </span>
    <span class="slider-grow__rim"></span>
    <span class="slider-grow__soil"></span>
  </span>
  <div class="slider-grow__track">
    <span class="slider-grow__rail"></span>
    <span class="slider-grow__fill"></span>
    <span class="slider-grow__thumb"></span>
    <input class="slider-grow__input" type="range" min="0" max="100" aria-label="Water" value="60"/>
  </div>
</div>
