<div class="slider-bass" style="--slider-bass-v:0.5">
  <span class="slider-bass__box" aria-hidden="true">
    <span class="slider-bass__shock"></span>
    <span class="slider-bass__shock"></span>
    <span class="slider-bass__surround">
      <span class="slider-bass__cone">
        <span class="slider-bass__cap"></span>
      </span>
    </span>
  </span>
  <div class="slider-bass__track">
    <span class="slider-bass__rail"></span>
    <span class="slider-bass__fill"></span>
    <span class="slider-bass__thumb"></span>
    <input class="slider-bass__input" type="range" min="0" max="100" aria-label="Bass" value="50"/>
  </div>
</div>
