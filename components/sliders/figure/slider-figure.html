<div class="slider-figure">
  <div class="slider-figure__row" aria-hidden="true">
    <span class="slider-figure__done" style="flex-grow:64"></span>
    <span class="slider-figure__num" style="transform:skewX(0deg)">
      64
      <span class="slider-figure__unit">%</span>
    </span>

</div>
