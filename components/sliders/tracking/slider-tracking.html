<div class="slider-tracking" style="--slider-tracking-v:0.3">
  <span class="slider-tracking__word" aria-hidden="true">
    <span class="slider-tracking__char" style="--i:0">M</span>
    <span class="slider-tracking__char" style="--i:1">O</span>
    <span class="slider-tracking__char" style="--i:2">T</span>
    <span class="slider-tracking__char" style="--i:3">I</span>
    <span class="slider-tracking__char" style="--i:4">O</span>
    <span class="slider-tracking__char" style="--i:5">N</span>
  </span>
  <span class="slider-tracking__val" aria-hidden="true">0.12 em</span>
  <div class="slider-tracking__track">
    <span class="slider-tracking__rail"></span>
    <span class="slider-tracking__thumb"></span>
    <input class="slider-tracking__input" type="range" min="0" max="100" aria-label="Letter spacing" aria-valuetext="0.12 em" value="30"/>
  </div>
</div>
