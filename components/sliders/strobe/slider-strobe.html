<div class="slider-strobe" style="--slider-strobe-x:88.92px">
  <span class="slider-strobe__track" aria-hidden="true"></span>
  <span class="slider-strobe__fill" aria-hidden="true"></span>
  <span class="slider-strobe__thumb" aria-hidden="true"></span>
  <p class="slider-strobe__value" aria-hidden="true">
    <span>Speed</span>
    <b>36%</b>
  </p>
  <input class="slider-strobe__input" type="range" min="0" max="100" aria-label="Speed" aria-valuetext="36%" value="36"/>
</div>
