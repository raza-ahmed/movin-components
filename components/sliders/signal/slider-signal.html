<div class="slider-signal" style="--slider-signal-v:0.64">
  <span class="slider-signal__bars" aria-hidden="true">
    <span class="slider-signal__bar" style="--k:0"></span>
    <span class="slider-signal__bar" style="--k:1"></span>
    <span class="slider-signal__bar" style="--k:2"></span>
    <span class="slider-signal__bar" style="--k:3"></span>
    <span class="slider-signal__bar" style="--k:4"></span>
  </span>
  <span class="slider-signal__word" aria-hidden="true">Strong</span>
  <div class="slider-signal__track">
    <span class="slider-signal__rail"></span>
    <span class="slider-signal__fill"></span>
    <span class="slider-signal__thumb"></span>
    <input class="slider-signal__input" type="range" min="0" max="100" aria-label="Signal strength" aria-valuetext="Strong" value="64"/>
  </div>
</div>
