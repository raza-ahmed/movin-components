<div class="slider-ascii">
  <p class="slider-ascii__top" aria-hidden="true">
    <span>VOLUME</span>
    <b> 55%</b>
  </p>
  <div class="slider-ascii__bar">
    <span aria-hidden="true">
      <span class="slider-ascii__edge">[</span>
      <span class="slider-ascii__on">==========</span>
      <span class="slider-ascii__tip">&gt;</span>
      <span class="slider-ascii__off">·········</span>
      <span class="slider-ascii__edge">]</span>
    </span>
    <input class="slider-ascii__input" type="range" min="0" max="100" aria-label="Volume" aria-valuetext="55%" value="55"/>
  </div>
</div>
