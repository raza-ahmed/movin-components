<div class="slider-throttle" style="--slider-throttle-v:0.45">
  <span class="slider-throttle__sky" aria-hidden="true">
    <span class="slider-throttle__streak" style="left:18px;animation-delay:0s"></span>
    <span class="slider-throttle__streak" style="left:40px;animation-delay:-0.22s"></span>
    <span class="slider-throttle__streak" style="left:96px;animation-delay:-0.11s"></span>
    <span class="slider-throttle__streak" style="left:118px;animation-delay:-0.33s"></span>
    <span class="slider-throttle__streak" style="left:64px;animation-delay:-0.4s"></span>
    <span class="slider-throttle__puff" style="--dx:-34px"></span>
    <span class="slider-throttle__puff" style="--dx:34px;animation-delay:-0.45s"></span>
    <span class="slider-throttle__pad"></span>
    <span class="slider-throttle__craft">
      <span class="slider-throttle__shake">
        <span class="slider-throttle__flame"></span>
        <svg class="slider-throttle__rocket" viewBox="0 0 30 64">
          <path class="slider-throttle__fin" d="M7 40L0 56L8 52ZM23 40L30 56L22 52Z"></path>
          <path class="slider-throttle__body" d="M15 0C24 10 25 26 23 58H7C5 26 6 10 15 0Z"></path>
          <circle class="slider-throttle__port" cx="15" cy="24" r="4.5"></circle>
        </svg>
      </span>
    </span>
  </span>
  <span class="slider-throttle__read" aria-hidden="true">Thrust <b>45%</b></span>
  <div class="slider-throttle__track">
    <span class="slider-throttle__rail"></span>
    <span class="slider-throttle__fill"></span>
    <span class="slider-throttle__thumb"></span>
    <input class="slider-throttle__input" type="range" min="0" max="100" aria-label="Thrust" aria-valuetext="45 percent" value="45"/>
  </div>
</div>
