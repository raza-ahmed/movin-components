<div class="slider-telescope" style="--slider-telescope-v:0.3">
  <div class="slider-telescope__row" aria-hidden="true">
    <span class="slider-telescope__scope">
      <span class="slider-telescope__leg" style="transform:rotate(22deg)"></span>
      <span class="slider-telescope__leg" style="transform:rotate(-14deg)"></span>
      <span class="slider-telescope__leg" style="transform:rotate(4deg)"></span>
      <span class="slider-telescope__arm">
        <span class="slider-telescope__tube slider-telescope__tube--3"></span>
        <span class="slider-telescope__tube slider-telescope__tube--2"></span>
        <span class="slider-telescope__tube slider-telescope__tube--1"></span>
        <span class="slider-telescope__eye"></span>
      </span>
    </span>
    <span class="slider-telescope__view">
      <span class="slider-telescope__moon"></span>
      <span class="slider-telescope__cross"></span>
      <span class="slider-telescope__mag">52×</span>
    </span>
  </div>
  <div class="slider-telescope__track">
    <span class="slider-telescope__rail"></span>
    <span class="slider-telescope__fill"></span>
    <span class="slider-telescope__thumb"></span>
    <input class="slider-telescope__input" type="range" min="0" max="100" aria-label="Zoom" aria-valuetext="52 times" value="30"/>
  </div>
</div>
