<div class="slider-fader" style="--slider-fader-v:0.7">
  <div class="slider-fader__desk">
    <span class="slider-fader__scale" aria-hidden="true">
      <span class="slider-fader__mark" style="top:calc(9px + 0 * (100% - 18px))">+6</span>
      <span class="slider-fader__mark" style="top:calc(9px + 0.09 * (100% - 18px))">0</span>
      <span class="slider-fader__mark" style="top:calc(9px + 0.24 * (100% - 18px))">-10</span>
      <span class="slider-fader__mark" style="top:calc(9px + 0.39 * (100% - 18px))">-20</span>
      <span class="slider-fader__mark" style="top:calc(9px + 0.7 * (100% - 18px))">-40</span>
      <span class="slider-fader__mark" style="top:calc(9px + 1 * (100% - 18px))">-60</span>
    </span>
    <span class="slider-fader__slot">
      <span class="slider-fader__groove"></span>
      <span class="slider-fader__cap"></span>
      <input class="slider-fader__input" type="range" min="0" max="100" aria-label="Channel level" aria-valuetext="-13.8 dB" value="70"/>
    </span>
    <span class="slider-fader__meter" aria-hidden="true">
      <span class="slider-fader__bar"></span>
      <span class="slider-fader__bar"></span>
    </span>
  </div>
  <span class="slider-fader__read" aria-hidden="true">-13.8 dB</span>
</div>
