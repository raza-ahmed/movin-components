<div class="slider-glass" style="--slider-glass-x:116px">
  <span class="slider-glass__track" aria-hidden="true"></span>
  <span class="slider-glass__fill" aria-hidden="true"></span>
  <span class="slider-glass__thumb" aria-hidden="true">
    <span class="slider-glass__solid"></span>
    <span class="slider-glass__lens">
      <span class="slider-glass__view">
        <span class="slider-glass__track"></span>
        <span class="slider-glass__fill"></span>
      </span>
    </span>
    <span class="slider-glass__shine"></span>
  </span>
  <input class="slider-glass__input" type="range" min="0" max="100" aria-label="Volume" value="48"/>
</div>
