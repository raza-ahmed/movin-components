<div class="slider-ruler" style="--slider-ruler-v:0.4">
  <span class="slider-ruler__read" aria-hidden="true">
    <span class="slider-ruler__num">72</span>
    <span class="slider-ruler__unit">kg</span>
  </span>
  <span class="slider-ruler__window">
    <span class="slider-ruler__strip" aria-hidden="true">
      <span class="slider-ruler__label" style="left:0">40</span>
      <span class="slider-ruler__label" style="left:80px">50</span>
      <span class="slider-ruler__label" style="left:160px">60</span>
      <span class="slider-ruler__label" style="left:240px">70</span>
      <span class="slider-ruler__label" style="left:320px">80</span>
      <span class="slider-ruler__label" style="left:400px">90</span>
      <span class="slider-ruler__label" style="left:480px">100</span>
      <span class="slider-ruler__label" style="left:560px">110</span>
      <span class="slider-ruler__label" style="left:640px">120</span>
    </span>
    <span class="slider-ruler__marker" aria-hidden="true"></span>
    <input class="slider-ruler__input" type="range" min="40" max="120" aria-label="Weight" aria-valuetext="72 kilograms" value="72"/>
  </span>
</div>
