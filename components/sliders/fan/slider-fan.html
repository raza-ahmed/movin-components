<div class="slider-fan" style="--slider-fan-v:0.6">
  <span class="slider-fan__unit" aria-hidden="true">
    <span class="slider-fan__cage">
      <div class="slider-fan__blades">
        <svg viewBox="-46 -46 92 92">
          <path class="slider-fan__blade" transform="rotate(0)" d="M0-6C8-24 26-38 34-30S20 0 0 0Z"></path>
          <path class="slider-fan__blade" transform="rotate(120)" d="M0-6C8-24 26-38 34-30S20 0 0 0Z"></path>
          <path class="slider-fan__blade" transform="rotate(240)" d="M0-6C8-24 26-38 34-30S20 0 0 0Z"></path>
          <circle class="slider-fan__hub" r="9"></circle>
        </svg>
      </div>
    </span>
    <span class="slider-fan__air">
      <span class="slider-fan__line"></span>
      <span class="slider-fan__line"></span>
      <span class="slider-fan__line"></span>
    </span>
  </span>
  <span class="slider-fan__level" aria-hidden="true">Speed <b>3</b></span>
  <div class="slider-fan__track">
    <span class="slider-fan__rail"></span>
    <span class="slider-fan__stop" style="left:calc(10px + 0 * (100% - 20px))"></span>
    <span class="slider-fan__stop" style="left:calc(10px + 0.2 * (100% - 20px))"></span>
    <span class="slider-fan__stop" style="left:calc(10px + 0.4 * (100% - 20px))"></span>
    <span class="slider-fan__stop" style="left:calc(10px + 0.6 * (100% - 20px))"></span>
    <span class="slider-fan__stop" style="left:calc(10px + 0.8 * (100% - 20px))"></span>
    <span class="slider-fan__stop" style="left:calc(10px + 1 * (100% - 20px))"></span>
    <span class="slider-fan__thumb"></span>
    <input class="slider-fan__input" type="range" min="0" max="5" aria-label="Fan speed" aria-valuetext="Speed 3" value="3"/>
  </div>
</div>
