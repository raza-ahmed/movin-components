<div class="slider-window" style="--slider-window-v:0.2">
  <span class="slider-window__door" aria-hidden="true">
    <span class="slider-window__opening">
      <span class="slider-window__wind" style="left:120px;top:18px;width:26px"></span>
      <span class="slider-window__wind" style="left:140px;top:32px;width:18px;animation-delay:-0.3s"></span>
      <span class="slider-window__wind" style="left:110px;top:46px;width:30px;animation-delay:-0.55s"></span>
      <span class="slider-window__dog">
        <svg viewBox="0 0 70 62">
          <path class="slider-window__ear" d="M14 10C4 12 0 28 6 36C10 30 14 22 20 16Z"></path>
          <path class="slider-window__ear slider-window__ear--r" d="M56 10C66 12 70 28 64 36C60 30 56 22 50 16Z"></path>
          <ellipse class="slider-window__head" cx="35" cy="30" rx="22" ry="24"></ellipse>
          <ellipse class="slider-window__snout" cx="35" cy="42" rx="12" ry="9"></ellipse>
          <ellipse class="slider-window__dark" cx="35" cy="37" rx="4.5" ry="3.2"></ellipse>
          <circle class="slider-window__dark" cx="26" cy="26" r="2.6"></circle>
          <circle class="slider-window__dark" cx="44" cy="26" r="2.6"></circle>
          <path class="slider-window__tongue" d="M31 48h8v6a4 4 0 0 1-8 0Z"></path>
        </svg>
      </span>
      <span class="slider-window__glass"></span>
    </span>
  </span>
  <div class="slider-window__track">
    <span class="slider-window__rail"></span>
    <span class="slider-window__fill"></span>
    <span class="slider-window__thumb"></span>
    <input class="slider-window__input" type="range" min="0" max="100" aria-label="Window" aria-valuetext="20 percent open" value="20"/>
  </div>
</div>
