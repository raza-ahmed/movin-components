<div class="slider-odometer" style="--slider-odometer-v:0.49">
  <span class="slider-odometer__read" aria-hidden="true">
    <span class="slider-odometer__sym">$</span>
    <span style="display:contents">
      <span class="slider-odometer__drum">
        <span class="slider-odometer__reel" style="--d:2;--delay:120ms">
          <span>0</span>
          <span>1</span>
          <span>2</span>
          <span>3</span>
          <span>4</span>
          <span>5</span>
          <span>6</span>
          <span>7</span>
          <span>8</span>
          <span>9</span>
        </span>
      </span>
    </span>
    <span style="display:contents">
      <span class="slider-odometer__comma">,</span>
      <span class="slider-odometer__drum">
        <span class="slider-odometer__reel" style="--d:4;--delay:80ms">
          <span>0</span>
          <span>1</span>
          <span>2</span>
          <span>3</span>
          <span>4</span>
          <span>5</span>
          <span>6</span>
          <span>7</span>
          <span>8</span>
          <span>9</span>
        </span>
      </span>
    </span>
    <span style="display:contents">
      <span class="slider-odometer__drum">
        <span class="slider-odometer__reel" style="--d:5;--delay:40ms">
          <span>0</span>
          <span>1</span>
          <span>2</span>
          <span>3</span>
          <span>4</span>
          <span>5</span>
          <span>6</span>
          <span>7</span>
          <span>8</span>
          <span>9</span>
        </span>
      </span>
    </span>
    <span style="display:contents">
      <span class="slider-odometer__drum">
        <span class="slider-odometer__reel" style="--d:0;--delay:0ms">
          <span>0</span>
          <span>1</span>
          <span>2</span>
          <span>3</span>
          <span>4</span>
          <span>5</span>
          <span>6</span>
          <span>7</span>
          <span>8</span>
          <span>9</span>
        </span>
      </span>
    </span>
  </span>
  <div class="slider-odometer__track">
    <span class="slider-odometer__rail"></span>
    <span class="slider-odometer__fill"></span>
    <span class="slider-odometer__thumb"></span>
    <input class="slider-odometer__input" type="range" min="0" max="5000" step="50" aria-label="Budget" aria-valuetext="2450 dollars" value="2450"/>
  </div>
</div>
