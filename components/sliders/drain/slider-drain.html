<div class="slider-drain" style="--slider-drain-v:72">
  <div class="slider-drain__head" aria-hidden="true">
    <span>Health</span>
    <span>
      <b>72</b>
      / 100
    </span>
  </div>
  <div class="slider-drain__bar" aria-hidden="true">
    <span class="slider-drain__track"></span>
    <span class="slider-drain__ghost" style="width:72%;transition:width 0.06s linear"></span>
    <span class="slider-drain__main" style="width:72%;transition:width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.25s"></span>
  </div>
  <span class="slider-drain__handle" aria-hidden="true"></span>
  <input class="slider-drain__input" type="range" min="0" max="100" aria-label="Health" aria-valuetext="72 of 100" value="72"/>
</div>
