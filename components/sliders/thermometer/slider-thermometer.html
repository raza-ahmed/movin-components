<div class="slider-thermometer" style="--slider-thermometer-v:0.55">
  <span class="slider-thermometer__body">
    <span class="slider-thermometer__tube" aria-hidden="true"></span>
    <span class="slider-thermometer__tick slider-thermometer__tick--major" style="bottom:30px" aria-hidden="true"></span>
    <span class="slider-thermometer__tick" style="bottom:40.8px" aria-hidden="true"></span>
    <span class="slider-thermometer__tick slider-thermometer__tick--major" style="bottom:51.6px" aria-hidden="true"></span>
    <span class="slider-thermometer__tick" style="bottom:62.400000000000006px" aria-hidden="true"></span>
    <span class="slider-thermometer__tick slider-thermometer__tick--major" style="bottom:73.2px" aria-hidden="true"></span>
    <span class="slider-thermometer__tick" style="bottom:84px" aria-hidden="true"></span>
    <span class="slider-thermometer__tick slider-thermometer__tick--major" style="bottom:94.80000000000001px" aria-hidden="true"></span>
    <span class="slider-thermometer__tick" style="bottom:105.60000000000001px" aria-hidden="true"></span>

    <span class="slider-thermometer__bulb" aria-hidden="true"></span>

  </span>
  <span class="slider-thermometer__read" aria-hidden="true">
    <span class="slider-thermometer__deg">18°</span>
    <span class="slider-thermometer__unit">CELSIUS</span>
  </span>
