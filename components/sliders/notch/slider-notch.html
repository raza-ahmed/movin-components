<div class="slider-notch" style="--slider-notch-v:0.5">
  <div class="slider-notch__track">
    <span class="slider-notch__rail"></span>
    <span class="slider-notch__fill"></span>
    <span class="slider-notch__stop" style="left:calc(12px + 0 * (100% - 24px));--k:0"></span>
    <span class="slider-notch__stop" style="left:calc(12px + 0.25 * (100% - 24px));--k:1"></span>
    <span class="slider-notch__stop" style="left:calc(12px + 0.5 * (100% - 24px));--k:2"></span>
    <span class="slider-notch__stop" style="left:calc(12px + 0.75 * (100% - 24px));--k:3"></span>
    <span class="slider-notch__stop" style="left:calc(12px + 1 * (100% - 24px));--k:4"></span>
    <span class="slider-notch__thumb">
      <span class="slider-notch__knob"></span>
    </span>
    <input class="slider-notch__input" type="range" min="0" max="4" aria-label="Size" aria-valuetext="M" value="2"/>
  </div>
  <div class="slider-notch__labels" aria-hidden="true">
    <span class="slider-notch__label" style="left:calc(12px + 0 * (100% - 24px))">XS</span>
    <span class="slider-notch__label" style="left:calc(12px + 0.25 * (100% - 24px))">S</span>
    <span class="slider-notch__label" data-on="" style="left:calc(12px + 0.5 * (100% - 24px))">M</span>
    <span class="slider-notch__label" style="left:calc(12px + 0.75 * (100% - 24px))">L</span>
    <span class="slider-notch__label" style="left:calc(12px + 1 * (100% - 24px))">XL</span>
  </div>
</div>
