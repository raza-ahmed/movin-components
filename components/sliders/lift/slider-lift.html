<div class="slider-lift" style="--slider-lift-x:142px;--slider-lift-tilt:0deg">
  <span class="slider-lift__rail" aria-hidden="true"></span>
  <span class="slider-lift__fill" aria-hidden="true"></span>
  <span class="slider-lift__shadow" aria-hidden="true"></span>
  <span class="slider-lift__thumb" aria-hidden="true">
    <span class="slider-lift__body"></span>
  </span>
  <span class="slider-lift__value" aria-hidden="true">60</span>
  <input class="slider-lift__input" type="range" min="0" max="100" aria-label="Opacity" aria-valuetext="60%" value="60"/>
</div>
