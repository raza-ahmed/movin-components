<div class="slider-radius" style="--slider-radius-v:0.32">
  <span class="slider-radius__stage" aria-hidden="true">
    <span class="slider-radius__shape"></span>
    <span class="slider-radius__guide">
      <span class="slider-radius__dot"></span>
    </span>
    <span class="slider-radius__px">16px</span>
  </span>
  <div class="slider-radius__track">
    <span class="slider-radius__rail"></span>
    <span class="slider-radius__fill"></span>
    <span class="slider-radius__thumb"></span>
    <input class="slider-radius__input" type="range" min="0" max="50" aria-label="Corner radius" aria-valuetext="16 pixels" value="16"/>
  </div>
</div>
