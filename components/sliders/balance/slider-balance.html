<div class="slider-balance" style="--slider-balance-v:0.3">
  <div class="slider-balance__scale" aria-hidden="true">
    <span class="slider-balance__post"></span>
    <span class="slider-balance__beam">
      <span class="slider-balance__pan slider-balance__pan--l">
        <span class="slider-balance__load"></span>
        <span class="slider-balance__dish"></span>
        <span class="slider-balance__tag" style="left:27px">Save</span>
      </span>
      <span class="slider-balance__pan slider-balance__pan--r">
        <span class="slider-balance__load"></span>
        <span class="slider-balance__dish"></span>
        <span class="slider-balance__tag" style="left:27px">Spend</span>
      </span>
    </span>
  </div>
  <span class="slider-balance__read" aria-hidden="true">Save <b>30%</b> · Spend <b>70%</b></span>
  <div class="slider-balance__track">
    <span class="slider-balance__rail"></span>
    <span class="slider-balance__fill"></span>
    <span class="slider-balance__thumb"></span>
    <input class="slider-balance__input" type="range" min="0" max="100" step="5" aria-label="Save" aria-valuetext="Save 30 percent, spend 70 percent" value="30"/>
  </div>
</div>
