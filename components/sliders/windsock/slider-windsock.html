<div class="slider-windsock" style="--slider-windsock-v:0.4">
  <div class="slider-windsock__field" aria-hidden="true">
    <span class="slider-windsock__gust" style="left:120px;top:30px;width:40px"></span>
    <span class="slider-windsock__gust" style="left:140px;top:46px;width:28px"></span>
    <span class="slider-windsock__pole"></span>
    <span class="slider-windsock__sock">
      <span class="slider-windsock__stripe" style="--k:0"></span>
      <span class="slider-windsock__stripe" style="--k:1"></span>
      <span class="slider-windsock__stripe" style="--k:2"></span>
      <span class="slider-windsock__stripe" style="--k:3"></span>
      <span class="slider-windsock__stripe" style="--k:4"></span>
    </span>
  </div>
  <span class="slider-windsock__read" aria-hidden="true"><b>12 knots</b> · Gentle breeze</span>
  <div class="slider-windsock__track">
    <span class="slider-windsock__rail"></span>
    <span class="slider-windsock__fill"></span>
    <span class="slider-windsock__thumb"></span>
    <input class="slider-windsock__input" type="range" min="0" max="30" aria-label="Wind speed" aria-valuetext="12 knots, gentle breeze" value="12"/>
  </div>
</div>
