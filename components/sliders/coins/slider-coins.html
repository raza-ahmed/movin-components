<div class="slider-coins" style="--slider-coins-v:0.4">
  <span class="slider-coins__table" aria-hidden="true">
    <span class="slider-coins__shadow"></span>
    <span class="slider-coins__coin" style="--k:0"></span>
    <span class="slider-coins__coin" style="--k:1"></span>
    <span class="slider-coins__coin" style="--k:2"></span>
    <span class="slider-coins__coin" style="--k:3"></span>
    <span class="slider-coins__coin" style="--k:4"></span>
    <span class="slider-coins__coin" style="--k:5"></span>
    <span class="slider-coins__coin" style="--k:6"></span>
    <span class="slider-coins__coin" style="--k:7"></span>
    <span class="slider-coins__coin" style="--k:8"></span>
    <span class="slider-coins__coin" style="--k:9"></span>
  </span>
  <span class="slider-coins__label" aria-hidden="true">Tip <b>$4</b></span>
  <div class="slider-coins__track">
    <span class="slider-coins__rail"></span>
    <span class="slider-coins__fill"></span>
    <span class="slider-coins__thumb"></span>
    <input class="slider-coins__input" type="range" min="0" max="10" aria-label="Tip" aria-valuetext="4 dollars" value="4"/>
  </div>
</div>
