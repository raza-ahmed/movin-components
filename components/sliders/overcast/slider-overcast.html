<div class="slider-overcast" style="--slider-overcast-v:0.35">
  <div class="slider-overcast__sky" aria-hidden="true">
    <span class="slider-overcast__sun"></span>
    <span class="slider-overcast__cloud" style="left:40px;top:36px;width:54px;--k:0;--from:-120px"></span>
    <span class="slider-overcast__cloud" style="left:112px;top:48px;width:64px;--k:1;--from:140px"></span>
    <span class="slider-overcast__cloud" style="left:8px;top:66px;width:60px;--k:2;--from:-140px"></span>
    <span class="slider-overcast__cloud" style="left:128px;top:22px;width:48px;--k:3;--from:150px"></span>
    <span class="slider-overcast__cloud" style="left:66px;top:58px;width:70px;--k:4;--from:-160px"></span>
  </div>
  <span class="slider-overcast__read" aria-hidden="true"><b>35%</b> · Partly cloudy</span>
  <div class="slider-overcast__track">
    <span class="slider-overcast__rail"></span>
    <span class="slider-overcast__fill"></span>
    <span class="slider-overcast__thumb"></span>
    <input class="slider-overcast__input" type="range" min="0" max="100" aria-label="Cloud cover" aria-valuetext="35 percent, partly cloudy" value="35"/>
  </div>
</div>
