<button class="btn-loading-lock" type="button" data-state="idle">
  <svg class="btn-loading-lock__icon btn-loading-lock__icon--idle" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
    <rect x="2" y="6" width="10" height="7" rx="1.5" stroke="#a7a7a7" stroke-width="1.5" />
    <path d="M4.5 6V4a2.5 2.5 0 015 0v2" stroke="#a7a7a7" stroke-width="1.5" stroke-linecap="round" />
  </svg>
  <svg class="btn-loading-lock__icon btn-loading-lock__icon--loading" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <circle cx="8" cy="8" r="6" stroke="#7c7c7c" stroke-width="2" stroke-dasharray="20 18" stroke-linecap="round" />
  </svg>
  <svg class="btn-loading-lock__icon btn-loading-lock__icon--done" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <path d="M3 8l4 4 6-6" stroke="#c9c9c9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  <span class="btn-loading-lock__label">UNLOCK</span>
</button>
