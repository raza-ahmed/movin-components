<button type="button" class="btn-rewind">
  <span class="btn-rewind__icon" aria-hidden="true">
    <svg class="btn-rewind__ghost" viewBox="0 0 24 24" fill="none">
      <path d="M4 12a8 8 0 1 0 2.3-5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
    </svg>
    <svg class="btn-rewind__arrow" viewBox="0 0 24 24" fill="none">
      <path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4.5h4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </span>
  <span class="btn-rewind__text">
    <span class="btn-rewind__now">Undo <span class="btn-rewind__left">· Deleted layer</span></span>
    <span class="btn-rewind__gone" aria-hidden="true"></span>
  </span>
  <span class="btn-rewind__sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" aria-live="polite"></span>
</button>
