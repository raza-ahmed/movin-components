<button type="button" class="btn-laser-etch" aria-label="Engrave">
  <span class="btn-laser-etch__text btn-laser-etch__text--outline" aria-hidden="true">Engrave</span>
  <span class="btn-laser-etch__text btn-laser-etch__text--etched" aria-hidden="true">Engrave</span>
  <span class="btn-laser-etch__beam" aria-hidden="true">
    <span class="btn-laser-etch__spark" style="--sx:9px;--sy:-14px;--d:0s"></span>
    <span class="btn-laser-etch__spark" style="--sx:-12px;--sy:6px;--d:0.12s"></span>
    <span class="btn-laser-etch__spark" style="--sx:6px;--sy:16px;--d:0.24s"></span>
    <span class="btn-laser-etch__spark" style="--sx:16px;--sy:-5px;--d:0.06s"></span>
    <span class="btn-laser-etch__spark" style="--sx:-9px;--sy:12px;--d:0.31s"></span>
    <span class="btn-laser-etch__spark" style="--sx:7px;--sy:-18px;--d:0.18s"></span>
  </span>
</button>
