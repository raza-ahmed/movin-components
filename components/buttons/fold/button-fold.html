<button class="btn-fold" type="button" aria-label="Send letter" data-alt="Sent">
  <span class="btn-fold__paper" aria-hidden="true">
    <span class="btn-fold__half btn-fold__half--bottom">
      <span class="btn-fold__face"><span class="btn-fold__text">Send letter</span></span>
      <span class="btn-fold__shade"></span>
    </span>
    <span class="btn-fold__half btn-fold__half--top">
      <span class="btn-fold__face"><span class="btn-fold__text">Send letter</span></span>
      <span class="btn-fold__back"></span>
    </span>
  </span>
</button>
