<label class="toggle-candle">
  <input class="toggle-candle__input" type="checkbox" role="switch">
  <span class="toggle-candle__candle" aria-hidden="true">
    <span class="toggle-candle__glow"></span>
    <span class="toggle-candle__smoke"></span>
    <span class="toggle-candle__flame"></span>
    <span class="toggle-candle__wick"></span>
    <span class="toggle-candle__wax"></span>
  </span>
  <span class="toggle-candle__label">Candle</span>
</label>
