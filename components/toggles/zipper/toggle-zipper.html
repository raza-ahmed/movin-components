<label class="toggle-zipper">
  <input class="toggle-zipper__input" type="checkbox" role="switch">
  <span class="toggle-zipper__track" aria-hidden="true">
    <span class="toggle-zipper__open"></span>
    <span class="toggle-zipper__closed"></span>
    <span class="toggle-zipper__slider"><span class="toggle-zipper__pull"></span></span>
  </span>
  <span class="toggle-zipper__label">Private</span>
</label>
