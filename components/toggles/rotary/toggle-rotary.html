<label class="toggle-rotary">
  <input class="toggle-rotary__input" type="checkbox" role="switch">
  <span class="toggle-rotary__dial" aria-hidden="true">
    <svg class="toggle-rotary__arc" viewBox="0 0 84 84" fill="none">
      <circle class="toggle-rotary__track" cx="42" cy="42" r="37" />
      <circle class="toggle-rotary__fill" cx="42" cy="42" r="37" />
    </svg>
    <span class="toggle-rotary__mark toggle-rotary__mark--off">OFF</span>
    <span class="toggle-rotary__mark toggle-rotary__mark--on">ON</span>
    <span class="toggle-rotary__knob"></span>
  </span>
  <span class="toggle-rotary__label">Heat</span>
</label>
