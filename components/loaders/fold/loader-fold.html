<div class="loader-fold" role="status" aria-label="Loading">
  <div class="loader-fold__paper" aria-hidden="true">
    <span class="loader-fold__q loader-fold__q--tl"></span>
    <span class="loader-fold__flap loader-fold__flap--bl">
      <span class="loader-fold__q"></span>
    </span>
    <span class="loader-fold__right">
      <span class="loader-fold__q loader-fold__q--tr"></span>
      <span class="loader-fold__flap">
        <span class="loader-fold__q"></span>
      </span>
    </span>
  </div>
</div>
