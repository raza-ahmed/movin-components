<div class="loader-metronome" role="status" aria-label="Loading">
  <span class="loader-metronome__body" aria-hidden="true"></span>
  <span class="loader-metronome__scale" aria-hidden="true"></span>
  <span class="loader-metronome__tick loader-metronome__tick--l" aria-hidden="true"></span>
  <span class="loader-metronome__tick loader-metronome__tick--r" aria-hidden="true"></span>
  <span class="loader-metronome__arm" aria-hidden="true">
    <span class="loader-metronome__weight"></span>
  </span>
  <span class="loader-metronome__pivot" aria-hidden="true"></span>
</div>
