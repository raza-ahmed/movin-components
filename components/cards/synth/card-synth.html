<div class="card-synth" role="group" aria-label="Oscillator">
  <svg class="card-synth__screen" viewBox="0 0 212 70" aria-hidden="true">
    <path class="card-synth__wave"></path>
  </svg>
  <div class="card-synth__knobs">
    <div class="card-synth__control"><span class="card-synth__knob" role="slider" tabindex="0" aria-label="Freq" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35" aria-valuetext="228 Hz" style="transform:rotate(-40.5deg)"></span>Freq<span class="card-synth__value">228 Hz</span></div>
    <div class="card-synth__control"><span class="card-synth__knob" role="slider" tabindex="0" aria-label="Shape" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20" aria-valuetext="Triangle" style="transform:rotate(-81deg)"></span>Shape<span class="card-synth__value">Triangle</span></div>
  </div>
</div>
