<article class="card-clock">
  <div class="card-clock__top">
    <svg class="card-clock__face" viewBox="0 0 112 112" aria-hidden="true">
      <circle class="card-clock__dial" cx="56" cy="56" r="55"></circle>
      <line class="card-clock__tick card-clock__tick--hour" x1="56" y1="8" x2="56" y2="16" transform="rotate(0 56 56)"></line>
      <line class="card-clock__tick" x1="56" y1="8" x2="56" y2="13" transform="rotate(30 56 56)"></line>
      <line class="card-clock__tick" x1="56" y1="8" x2="56" y2="13" transform="rotate(60 56 56)"></line>
      <line class="card-clock__tick card-clock__tick--hour" x1="56" y1="8" x2="56" y2="16" transform="rotate(90 56 56)"></line>
      <line class="card-clock__tick" x1="56" y1="8" x2="56" y2="13" transform="rotate(120 56 56)"></line>
      <line class="card-clock__tick" x1="56" y1="8" x2="56" y2="13" transform="rotate(150 56 56)"></line>
      <line class="card-clock__tick card-clock__tick--hour" x1="56" y1="8" x2="56" y2="16" transform="rotate(180 56 56)"></line>
      <line class="card-clock__tick" x1="56" y1="8" x2="56" y2="13" transform="rotate(210 56 56)"></line>
      <line class="card-clock__tick" x1="56" y1="8" x2="56" y2="13" transform="rotate(240 56 56)"></line>
      <line class="card-clock__tick card-clock__tick--hour" x1="56" y1="8" x2="56" y2="16" transform="rotate(270 56 56)"></line>
      <line class="card-clock__tick" x1="56" y1="8" x2="56" y2="13" transform="rotate(300 56 56)"></line>
      <line class="card-clock__tick" x1="56" y1="8" x2="56" y2="13" transform="rotate(330 56 56)"></line>
      <line class="card-clock__hand card-clock__hand--h" x1="56" y1="64" x2="56" y2="28" style="transform:rotate(-56deg)"></line>
      <line class="card-clock__hand card-clock__hand--m" x1="56" y1="64" x2="56" y2="14" style="transform:rotate(51.6deg)"></line>
      <line class="card-clock__hand card-clock__hand--s" x1="56" y1="64" x2="56" y2="10" style="transform:rotate(-144deg)"></line>
      <circle class="card-clock__pin" cx="56" cy="56" r="3.5"></circle>
    </svg>
    <div class="card-clock__cities" role="group" aria-label="City">
      <button type="button" class="card-clock__city" aria-pressed="true">London</button>
      <button type="button" class="card-clock__city" aria-pressed="false">Tokyo</button>
      <button type="button" class="card-clock__city" aria-pressed="false">New York</button>
    </div>
  </div>
  <p class="card-clock__read">
    <b>10:08</b>
    <span>London · GMT</span>
  </p>
</article>
