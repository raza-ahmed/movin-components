<article class="card-tracking">
  <div class="card-tracking__head">
    <b>Order #4821</b>
    <button type="button" class="card-tracking__next">Next update</button>
  </div>
  <ol class="card-tracking__list" aria-live="polite">
    <li class="card-tracking__step card-tracking__step--done card-tracking__step--filled" style="--i:0">
      <span class="card-tracking__rail" aria-hidden="true">
        <span class="card-tracking__dot"></span>
        <span class="card-tracking__seg">
          <span></span>
        </span>
      </span>
      <span>
        <span class="card-tracking__t">Ordered</span>
        <span class="card-tracking__when">Mon 9:14</span>
      </span>
    </li>
    <li class="card-tracking__step card-tracking__step--done card-tracking__step--filled" style="--i:1">
      <span class="card-tracking__rail" aria-hidden="true">
        <span class="card-tracking__dot"></span>
        <span class="card-tracking__seg">
          <span></span>
        </span>
      </span>
      <span>
        <span class="card-tracking__t">Packed</span>
        <span class="card-tracking__when">Mon 16:02</span>
      </span>
    </li>
    <li class="card-tracking__step card-tracking__step--done card-tracking__step--now" style="--i:2" aria-current="step">
      <span class="card-tracking__rail" aria-hidden="true">
        <span class="card-tracking__dot"></span>
        <span class="card-tracking__seg">
          <span></span>
        </span>
      </span>
      <span>
        <span class="card-tracking__t">Shipped</span>
        <span class="card-tracking__when">Tue 8:30</span>
      </span>
    </li>
    <li class="card-tracking__step" style="--i:3">
      <span class="card-tracking__rail" aria-hidden="true">
        <span class="card-tracking__dot"></span>
      </span>
      <span>
        <span class="card-tracking__t">Delivered</span>
        <span class="card-tracking__when">Expected Thu</span>
      </span>
    </li>
  </ol>
</article>
