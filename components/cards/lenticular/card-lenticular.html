<div class="card-lenticular" tabindex="0" aria-label="Lenticular card: day turns to night as it tilts">
  <div class="card-lenticular__card">
    <div class="card-lenticular__scene card-lenticular__scene--day" aria-hidden="true">
      <span class="card-lenticular__sun"></span>
      <span class="card-lenticular__hill"></span>
    </div>
    <div class="card-lenticular__scene card-lenticular__scene--night" aria-hidden="true">
      <span class="card-lenticular__stars"></span>
      <span class="card-lenticular__moon"></span>
      <span class="card-lenticular__hill"></span>
    </div>
    <div class="card-lenticular__ridges" aria-hidden="true"></div>
  </div>
  <div class="card-lenticular__caption">
    <span class="card-lenticular__title">Day &amp; Night</span>
    <span class="card-lenticular__text">Move across to tilt</span>
  </div>
</div>
