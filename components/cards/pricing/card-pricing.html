<article class="card-pricing card-pricing--monthly">
  <div class="card-pricing__switch" role="group" aria-label="Billing period">
    <span class="card-pricing__knob" aria-hidden="true"></span>
    <button type="button" class="card-pricing__opt" aria-pressed="true">Monthly</button>
    <button type="button" class="card-pricing__opt" aria-pressed="false">Yearly</button>
  </div>
  <div class="card-pricing__row">
    <div class="card-pricing__price">
      <span class="card-pricing__sr">$12 per month</span>
      <span class="card-pricing__cur" aria-hidden="true">$</span>
      <span class="card-pricing__digits" aria-hidden="true">
        <span class="card-pricing__reel" style="transform:translateY(-40px);transition-delay:0ms">
          <span>0</span>
          <span>1</span>
          <span>2</span>
          <span>3</span>
          <span>4</span>
          <span>5</span>
          <span>6</span>
          <span>7</span>
          <span>8</span>
          <span>9</span>
        </span>
        <span class="card-pricing__reel" style="transform:translateY(-80px);transition-delay:70ms">
          <span>0</span>
          <span>1</span>
          <span>2</span>
          <span>3</span>
          <span>4</span>
          <span>5</span>
          <span>6</span>
          <span>7</span>
          <span>8</span>
          <span>9</span>
        </span>
      </span>
    </div>
    <span class="card-pricing__per" aria-hidden="true">/mo</span>
    <span class="card-pricing__badge">Save 17%</span>
  </div>
  <p class="card-pricing__note">Billed monthly</p>
  <ul class="card-pricing__list">
    <li>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12.5l4.5 4.5L19 7.5"></path>
      </svg>
      Unlimited projects
    </li>
    <li>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12.5l4.5 4.5L19 7.5"></path>
      </svg>
      Version history
    </li>
    <li>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12.5l4.5 4.5L19 7.5"></path>
      </svg>
      Priority support
    </li>
  </ul>
</article>
