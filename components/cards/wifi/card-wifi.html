<article class="card-wifi">
  <p class="card-wifi__head">
    Wi-Fi
    <span>On</span>
  </p>
  <ul class="card-wifi__list">
    <li class="card-wifi__item card-wifi__item--on" style="transform:translateY(0px)">
      <button type="button" class="card-wifi__row" aria-label="Studio, Connected, secured">
        <svg class="card-wifi__signal" viewBox="0 0 18 14" aria-hidden="true">
          <circle class="card-wifi__dot" cx="9" cy="12" r="1.5"></circle>
          <path class="card-wifi__arc card-wifi__arc--lit" d="M 6.12 9.2 A 4 4 0 0 1 11.88 9.2"></path>
          <path class="card-wifi__arc card-wifi__arc--lit" d="M 3.6 6.75 A 7.5 7.5 0 0 1 14.4 6.75"></path>
          <path class="card-wifi__arc card-wifi__arc--lit" d="M 1.08 4.3 A 11 11 0 0 1 16.92 4.3"></path>
        </svg>
        Studio
        <span class="card-wifi__status" aria-hidden="true">
          <svg class="card-wifi__tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"></path>
          </svg>
        </span>
      </button>
    </li>
    <li class="card-wifi__item" style="transform:translateY(38px)">
      <button type="button" class="card-wifi__row" aria-label="Home 5G, secured">
        <svg class="card-wifi__signal" viewBox="0 0 18 14" aria-hidden="true">
          <circle class="card-wifi__dot" cx="9" cy="12" r="1.5"></circle>
          <path class="card-wifi__arc card-wifi__arc--lit" d="M 6.12 9.2 A 4 4 0 0 1 11.88 9.2"></path>
          <path class="card-wifi__arc card-wifi__arc--lit" d="M 3.6 6.75 A 7.5 7.5 0 0 1 14.4 6.75"></path>
          <path class="card-wifi__arc card-wifi__arc--lit" d="M 1.08 4.3 A 11 11 0 0 1 16.92 4.3"></path>
        </svg>
        Home 5G
        <span class="card-wifi__status" aria-hidden="true">
          <svg class="card-wifi__lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="10" rx="2"></rect>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
          </svg>
        </span>
      </button>
    </li>
    <li class="card-wifi__item" style="transform:translateY(76px)">
      <button type="button" class="card-wifi__row" aria-label="Cafe Guest">
        <svg class="card-wifi__signal" viewBox="0 0 18 14" aria-hidden="true">
          <circle class="card-wifi__dot" cx="9" cy="12" r="1.5"></circle>
          <path class="card-wifi__arc card-wifi__arc--lit" d="M 6.12 9.2 A 4 4 0 0 1 11.88 9.2"></path>
          <path class="card-wifi__arc card-wifi__arc--lit" d="M 3.6 6.75 A 7.5 7.5 0 0 1 14.4 6.75"></path>
          <path class="card-wifi__arc" d="M 1.08 4.3 A 11 11 0 0 1 16.92 4.3"></path>
        </svg>
        Cafe Guest
        <span class="card-wifi__status" aria-hidden="true"></span>
      </button>
    </li>
    <li class="card-wifi__item" style="transform:translateY(114px)">
      <button type="button" class="card-wifi__row" aria-label="Printer 4F, secured">
        <svg class="card-wifi__signal" viewBox="0 0 18 14" aria-hidden="true">
          <circle class="card-wifi__dot" cx="9" cy="12" r="1.5"></circle>
          <path class="card-wifi__arc card-wifi__arc--lit" d="M 6.12 9.2 A 4 4 0 0 1 11.88 9.2"></path>
          <path class="card-wifi__arc" d="M 3.6 6.75 A 7.5 7.5 0 0 1 14.4 6.75"></path>
          <path class="card-wifi__arc" d="M 1.08 4.3 A 11 11 0 0 1 16.92 4.3"></path>
        </svg>
        Printer 4F
        <span class="card-wifi__status" aria-hidden="true">
          <svg class="card-wifi__lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="10" rx="2"></rect>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
          </svg>
        </span>
      </button>
    </li>
  </ul>
</article>
