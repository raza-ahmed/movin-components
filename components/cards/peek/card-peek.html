<article class="card-peek">
  <div class="card-peek__body" aria-hidden="false">
    <p class="card-peek__title">Files</p>
    <p class="card-peek__hint">Press and hold to peek</p>
    <div class="card-peek__grid">
      <button type="button" class="card-peek__tile" aria-label="Peek at Brief.pdf">
        <svg class="card-peek__ring" aria-hidden="true">
          <rect x="1" y="1" width="68" height="72" rx="12" pathLength="1"></rect>
        </svg>
        <span class="card-peek__icon" aria-hidden="true"></span>
        Brief.pdf
      </button>
      <button type="button" class="card-peek__tile" aria-label="Peek at Moodboard">
        <svg class="card-peek__ring" aria-hidden="true">
          <rect x="1" y="1" width="68" height="72" rx="12" pathLength="1"></rect>
        </svg>
        <span class="card-peek__icon card-peek__icon--img" aria-hidden="true"></span>
        Moodboard
      </button>
      <button type="button" class="card-peek__tile" aria-label="Peek at Notes.md">
        <svg class="card-peek__ring" aria-hidden="true">
          <rect x="1" y="1" width="68" height="72" rx="12" pathLength="1"></rect>
        </svg>
        <span class="card-peek__icon" aria-hidden="true"></span>
        Notes.md
      </button>
    </div>
  </div>
</article>
