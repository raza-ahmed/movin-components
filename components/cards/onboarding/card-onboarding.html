<article class="card-onboarding" aria-roledescription="carousel" aria-label="Getting started">
  <div class="card-onboarding__art" aria-hidden="true">
    <div class="card-onboarding__step">
      <div class="card-onboarding__shape card-onboarding__shape--0">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
  <div class="card-onboarding__step" aria-live="polite">
    <p class="card-onboarding__title">1. Collect</p>
    <p class="card-onboarding__text">Save anything you like into a collection as you browse.</p>
  </div>
  <div class="card-onboarding__foot">
    <div class="card-onboarding__dots" aria-hidden="true">
      <span class="card-onboarding__dot" style="left:0"></span>
      <span class="card-onboarding__dot" style="left:14px"></span>
      <span class="card-onboarding__dot" style="left:28px"></span>
      <span class="card-onboarding__pill" style="left:0;right:28px;transition:right 0.25s cubic-bezier(0.3, 1.2, 0.5, 1), left 0.3s cubic-bezier(0.3, 1.2, 0.5, 1) 0.12s"></span>
    </div>
    <div class="card-onboarding__btns">
      <button type="button" class="card-onboarding__btn">Next</button>
    </div>
  </div>
</article>
