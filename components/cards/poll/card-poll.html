<article class="card-poll">
  <p class="card-poll__q" id="card-poll-q">Which easing do you reach for first?</p>
  <ul class="card-poll__list" aria-labelledby="card-poll-q">
    <li>
      <button type="button" class="card-poll__opt" aria-pressed="false" aria-label="Ease out">
        <span class="card-poll__bar" style="transition-delay:0ms" aria-hidden="true"></span>
        <span class="card-poll__t">Ease out</span>
        <span class="card-poll__pct" aria-hidden="true">0%</span>
      </button>
    </li>
    <li>
      <button type="button" class="card-poll__opt" aria-pressed="false" aria-label="Spring">
        <span class="card-poll__bar" style="transition-delay:80ms" aria-hidden="true"></span>
        <span class="card-poll__t">Spring</span>
        <span class="card-poll__pct" aria-hidden="true">0%</span>
      </button>
    </li>
    <li>
      <button type="button" class="card-poll__opt" aria-pressed="false" aria-label="Linear">
        <span class="card-poll__bar" style="transition-delay:160ms" aria-hidden="true"></span>
        <span class="card-poll__t">Linear</span>
        <span class="card-poll__pct" aria-hidden="true">0%</span>
      </button>
    </li>
  </ul>
  <p class="card-poll__foot">100 votes</p>
</article>
