<article class="card-storage">
  <p class="card-storage__head">
    <b>Storage</b>
    <span class="card-storage__read">182 of 256 GB used</span>
  </p>
  <div class="card-storage__bar" aria-hidden="true">
    <span class="card-storage__seg card-storage__seg--0" style="width:28.906%;animation-delay:0ms"></span>
    <span class="card-storage__seg card-storage__seg--1" style="width:20.313%;animation-delay:110ms"></span>
    <span class="card-storage__seg card-storage__seg--2" style="width:12.109%;animation-delay:220ms"></span>
    <span class="card-storage__seg card-storage__seg--3" style="width:9.766%;animation-delay:330ms"></span>
    <span class="card-storage__seg card-storage__seg--free"></span>
  </div>
  <ul class="card-storage__legend">
    <li>
      <button type="button" class="card-storage__row">
        <span class="card-storage__dot card-storage__seg--0" aria-hidden="true"></span>
        Photos
        <span>74 GB</span>
      </button>
    </li>
    <li>
      <button type="button" class="card-storage__row">
        <span class="card-storage__dot card-storage__seg--1" aria-hidden="true"></span>
        Apps
        <span>52 GB</span>
      </button>
    </li>
    <li>
      <button type="button" class="card-storage__row">
        <span class="card-storage__dot card-storage__seg--2" aria-hidden="true"></span>
        Documents
        <span>31 GB</span>
      </button>
    </li>
    <li>
      <button type="button" class="card-storage__row">
        <span class="card-storage__dot card-storage__seg--3" aria-hidden="true"></span>
        Other
        <span>25 GB</span>
      </button>
    </li>
  </ul>
</article>
