<article class="card-refresh">
  <div class="card-refresh__head">
    Inbox
    <button type="button" class="card-refresh__btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path>
      </svg>
    </button>
  </div>
  <div class="card-refresh__view">
    <div class="card-refresh__pull" style="opacity:0" aria-hidden="true">
      <svg class="card-refresh__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(0deg)">
        <path d="M12 5v14M6 13l6 6 6-6"></path>
      </svg>
      Pull to refresh
    </div>
    <ul class="card-refresh__list card-refresh__list--settle" style="transform:translateY(0px)" aria-live="polite">
      <li class="card-refresh__item">Ana: the prints are in</li>
      <li class="card-refresh__item">Deploy finished in 41s</li>
      <li class="card-refresh__item">Standup moved to 10:30</li>
    </ul>
  </div>
</article>
