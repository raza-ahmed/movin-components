<article class="card-note" aria-label="Sticky note: Before Friday. Call the printer by 3, send the proofs to Ana, book the van, water the fern.">
  <div class="card-note__paper" aria-hidden="true">
    <span class="card-note__shadow" style="transform:scale(1);opacity:1"></span>
    <div class="card-note__half card-note__half--top">
      <p class="card-note__title">Before Friday</p>
      <p class="card-note__line">Call the printer by 3</p>
      <p class="card-note__line">Send the proofs to Ana</p>
      <p class="card-note__line">Book the van</p>
      <p class="card-note__line">Water the fern</p>
    </div>
    <div class="card-note__half card-note__half--bottom" style="transform:perspective(420px) rotateX(0deg)">
      <p class="card-note__title">Before Friday</p>
      <p class="card-note__line">Call the printer by 3</p>
      <p class="card-note__line">Send the proofs to Ana</p>
      <p class="card-note__line">Book the van</p>
      <p class="card-note__line">Water the fern</p>
    </div>
    <span class="card-note__shade" style="opacity:0;transform:perspective(420px) rotateX(0deg);transform-origin:50% 55%"></span>
    <span class="card-note__pin"></span>
  </div>
</article>
