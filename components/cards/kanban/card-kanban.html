<article class="card-kanban" aria-label="Board">
  <div>
    <span class="card-kanban__col" style="left:10px" aria-hidden="true"></span>
    <p class="card-kanban__head" style="left:14px">To do<span>2</span></p>
  </div>
  <div>
    <span class="card-kanban__col" style="left:124px" aria-hidden="true"></span>
    <p class="card-kanban__head" style="left:128px">Done<span>1</span></p>
  </div>
  <button type="button" class="card-kanban__chip" style="transform:translate(10px, 36px)" aria-label="Write brief, in To do. Press to move it to Done.">Write brief</button>
  <button type="button" class="card-kanban__chip" style="transform:translate(10px, 76px)" aria-label="Pick type, in To do. Press to move it to Done.">Pick type</button>
  <button type="button" class="card-kanban__chip card-kanban__chip--done" style="transform:translate(124px, 36px)" aria-label="Moodboard, in Done. Press to move it to To do.">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 12.5l4.5 4.5L19 7.5"></path>
    </svg>
    Moodboard
  </button>
  <span class="card-kanban__live" aria-live="polite"></span>
</article>
