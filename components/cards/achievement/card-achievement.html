<button type="button" class="card-achievement" aria-pressed="false">
  <span class="card-achievement__badge" aria-hidden="true">
    <span class="card-achievement__rays"></span>
    <span class="card-achievement__spark" style="--a:0deg"></span>
    <span class="card-achievement__spark" style="--a:45deg"></span>
    <span class="card-achievement__spark" style="--a:90deg"></span>
    <span class="card-achievement__spark" style="--a:135deg"></span>
    <span class="card-achievement__spark" style="--a:180deg"></span>
    <span class="card-achievement__spark" style="--a:225deg"></span>
    <span class="card-achievement__spark" style="--a:270deg"></span>
    <span class="card-achievement__spark" style="--a:315deg"></span>
    <span class="card-achievement__coin">
      <span class="card-achievement__side card-achievement__side--locked">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"></rect>
          <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2"></path>
        </svg>
      </span>
      <span class="card-achievement__side card-achievement__side--won">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M15 3a8 8 0 1 0 6 13A9 9 0 0 1 15 3Z"></path>
        </svg>
      </span>
    </span>
  </span>
  <span class="card-achievement__text">
    <span class="card-achievement__title">Night Owl</span>
    <br/>
    <span class="card-achievement__desc">Ship something after midnight</span>
    <span class="card-achievement__xp">
      <span class="card-achievement__bar">
        <span></span>
      </span>
      <span class="card-achievement__gain">Locked</span>
    </span>
  </span>
</button>
