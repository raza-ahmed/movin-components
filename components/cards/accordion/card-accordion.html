<article class="card-accordion">
  <div class="card-accordion__item">
    <button type="button" id="card-accordion-q0" class="card-accordion__q" aria-expanded="true" aria-controls="card-accordion-a0">
      Can I cancel anytime?
      <span class="card-accordion__icon" aria-hidden="true"></span>
    </button>
    <div id="card-accordion-a0" class="card-accordion__panel card-accordion__panel--open" role="region" aria-labelledby="card-accordion-q0">
      <div>
        <p class="card-accordion__a" aria-hidden="false">Yes. Your plan runs to the end of the period you paid for, then stops.</p>
      </div>
    </div>
  </div>
  <div class="card-accordion__item">
    <button type="button" id="card-accordion-q1" class="card-accordion__q" aria-expanded="false" aria-controls="card-accordion-a1">
      Do you offer refunds?
      <span class="card-accordion__icon" aria-hidden="true"></span>
    </button>
    <div id="card-accordion-a1" class="card-accordion__panel" role="region" aria-labelledby="card-accordion-q1">
      <div>
        <p class="card-accordion__a" aria-hidden="true">Within 14 days of a charge, with no questions asked.</p>
      </div>
    </div>
  </div>
  <div class="card-accordion__item">
    <button type="button" id="card-accordion-q2" class="card-accordion__q" aria-expanded="false" aria-controls="card-accordion-a2">
      Is there a team plan?
      <span class="card-accordion__icon" aria-hidden="true"></span>
    </button>
    <div id="card-accordion-a2" class="card-accordion__panel" role="region" aria-labelledby="card-accordion-q2">
      <div>
        <p class="card-accordion__a" aria-hidden="true">Teams of three or more get shared libraries and one invoice.</p>
      </div>
    </div>
  </div>
</article>
