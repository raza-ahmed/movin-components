<article class="card-gift">
  <p class="card-gift__title">A gift from Ana</p>
  <p class="card-gift__sub" aria-live="polite">Tap the box to open it</p>
  <button type="button" class="card-gift__open" aria-label="Open the gift">
    <span class="card-gift__part card-gift__back"></span>
    <span class="card-gift__part card-gift__voucher" aria-hidden="true">
      <b>$25</b>
      <code>MOVE-7Q2X</code>
    </span>
    <span class="card-gift__part card-gift__front"></span>
    <span class="card-gift__part card-gift__ribbon"></span>
    <span class="card-gift__part card-gift__lid"></span>
    <span class="card-gift__part card-gift__loop card-gift__loop--l"></span>
    <span class="card-gift__part card-gift__loop card-gift__loop--r"></span>
  </button>
  <button type="button" class="card-gift__again" tabindex="-1">Wrap again</button>
</article>
