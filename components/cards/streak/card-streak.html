<article class="card-streak">
  <div class="card-streak__head">
    <svg class="card-streak__flame" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2c1 3.5 5 5.5 5 11a5 5 0 0 1-10 0c0-2.4 1.2-4 2.5-5.2.2 1.8 1 3 2.3 3.4C11 9 11 5.5 12 2z"></path>
    </svg>
    <span class="card-streak__count">
      <span class="card-streak__num card-streak__num--down">4</span>
    </span>
    <span class="card-streak__label">day streak</span>
    <span class="card-streak__best">Best 12</span>
  </div>
  <ol class="card-streak__week">
    <li class="card-streak__day">
      <span class="card-streak__dot card-streak__dot--done" role="img" aria-label="Mon: done">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12.5l4.5 4.5L19 7.5"></path>
        </svg>
      </span>
      M
    </li>
    <li class="card-streak__day">
      <span class="card-streak__dot card-streak__dot--done" role="img" aria-label="Tue: done">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12.5l4.5 4.5L19 7.5"></path>
        </svg>
      </span>
      T
    </li>
    <li class="card-streak__day">
      <span class="card-streak__dot card-streak__dot--done" role="img" aria-label="Wed: done">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12.5l4.5 4.5L19 7.5"></path>
        </svg>
      </span>
      W
    </li>
    <li class="card-streak__day">
      <span class="card-streak__dot card-streak__dot--done" role="img" aria-label="Thu: done">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12.5l4.5 4.5L19 7.5"></path>
        </svg>
      </span>
      T
    </li>
    <li class="card-streak__day card-streak__day--today">
      <button type="button" class="card-streak__dot card-streak__dot--today" aria-pressed="false" aria-label="Check in for Fri">
        <span class="card-streak__fill" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"></path>
        </svg>
      </button>
      F
    </li>
    <li class="card-streak__day">
      <span class="card-streak__dot" role="img" aria-label="Sat: not yet"></span>
      S
    </li>
    <li class="card-streak__day">
      <span class="card-streak__dot" role="img" aria-label="Sun: not yet"></span>
      S
    </li>
  </ol>
</article>
