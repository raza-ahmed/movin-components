<article class="card-servings">
  <div class="card-servings__top">
    <p class="card-servings__title">Lemon pasta</p>
    <div class="card-servings__step">
      <button type="button" class="card-servings__btn" aria-label="Fewer servings">−</button>
      <span class="card-servings__n" aria-live="polite">
        2
        <span class="card-servings__sr"> servings</span>
      </span>
      <button type="button" class="card-servings__btn" aria-label="More servings">+</button>
    </div>
  </div>
  <ul class="card-servings__list">
    <li class="card-servings__row">
      Spaghetti
      <span class="card-servings__qty">
        <span style="animation-delay:0ms">200 g</span>
      </span>
    </li>
    <li class="card-servings__row">
      Lemons
      <span class="card-servings__qty">
        <span style="animation-delay:60ms">1</span>
      </span>
    </li>
    <li class="card-servings__row">
      Parmesan
      <span class="card-servings__qty">
        <span style="animation-delay:120ms">50 g</span>
      </span>
    </li>
    <li class="card-servings__row">
      Butter
      <span class="card-servings__qty">
        <span style="animation-delay:180ms">30 g</span>
      </span>
    </li>
  </ul>
</article>
