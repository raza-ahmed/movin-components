<div class="tabs-passport">
  <div class="tabs-passport__list" role="tablist" aria-label="Trips">

  <div class="tabs-passport__page">
    <span class="tabs-passport__head" aria-hidden="true">

      <span class="tabs-passport__stamp" style="--tabs-passport-def:50%;--tabs-passport-tilt:-12deg;width:108px;height:108px;padding:0">

        <span class="tabs-passport__country">Japan</span>

      </span>

    <div class="tabs-passport__panel" role="tabpanel" id="tabs-passport-panel-1" aria-labelledby="tabs-passport-tab-1" hidden="">
      <span class="tabs-passport__stamp" style="--tabs-passport-def:6px;--tabs-passport-tilt:8deg">
        <span class="tabs-passport__meta">ARRIVED</span>
        <span class="tabs-passport__country">Peru</span>
        <span class="tabs-passport__meta">LIM · 04 JUN 2026</span>
      </span>
    </div>
    <div class="tabs-passport__panel" role="tabpanel" id="tabs-passport-panel-2" aria-labelledby="tabs-passport-tab-2" hidden="">
      <span class="tabs-passport__stamp" style="--tabs-passport-def:50% / 40%;--tabs-passport-tilt:-5deg">
        <span class="tabs-passport__meta">ARRIVED</span>
        <span class="tabs-passport__country">Iceland</span>
        <span class="tabs-passport__meta">KEF · 21 SEP 2026</span>
