<div class="tabs-blinds">
  <div class="tabs-blinds__list" role="tablist" aria-label="Gallery">
    <button class="tabs-blinds__tab" type="button" role="tab" id="tabs-blinds-tab-0" aria-selected="true" aria-controls="tabs-blinds-panel-0" tabindex="0">Coast</button>
    <button class="tabs-blinds__tab" type="button" role="tab" id="tabs-blinds-tab-1" aria-selected="false" aria-controls="tabs-blinds-panel-1" tabindex="-1">Forest</button>
    <button class="tabs-blinds__tab" type="button" role="tab" id="tabs-blinds-tab-2" aria-selected="false" aria-controls="tabs-blinds-panel-2" tabindex="-1">Desert</button>
  </div>
  <div class="tabs-blinds__frame">
    <div class="tabs-blinds__panel" role="tabpanel" id="tabs-blinds-panel-0" aria-labelledby="tabs-blinds-tab-0">
      <span class="tabs-blinds__art" style="--tabs-blinds-art:linear-gradient(light-dark(#6d7179, #7d8087), light-dark(#dbdde1, #2e3035) 58%, light-dark(#5f626a, #a7abb2) 58% 62%, light-dark(#ebedf0, #232529) 62%)"></span>
      <span class="tabs-blinds__caption">Cliffs at low tide</span>
    </div>
    <div class="tabs-blinds__panel" role="tabpanel" id="tabs-blinds-panel-1" aria-labelledby="tabs-blinds-tab-1" hidden="">
      <span class="tabs-blinds__art" style="--tabs-blinds-art:repeating-linear-gradient(90deg, light-dark(#ebedf0, #232529) 0 14px, light-dark(#cbced3, #393c41) 14px 18px), light-dark(#dbdde1, #2e3035)"></span>
      <span class="tabs-blinds__caption">Pines after rain</span>
    </div>
    <div class="tabs-blinds__panel" role="tabpanel" id="tabs-blinds-panel-2" aria-labelledby="tabs-blinds-tab-2" hidden="">
      <span class="tabs-blinds__art" style="--tabs-blinds-art:radial-gradient(circle at 70% 30%, light-dark(#42454c, #e5e6e9) 0 12px, transparent 13px), linear-gradient(light-dark(#6d7179, #7d8087) 60%, light-dark(#5f626a, #a7abb2) 60%)"></span>
      <span class="tabs-blinds__caption">Dunes at noon</span>
    </div>
    <span class="tabs-blinds__slats" aria-hidden="true">
      <span class="tabs-blinds__slat" style="--k:0"></span>
      <span class="tabs-blinds__slat" style="--k:1"></span>
      <span class="tabs-blinds__slat" style="--k:2"></span>
      <span class="tabs-blinds__slat" style="--k:3"></span>
      <span class="tabs-blinds__slat" style="--k:4"></span>
      <span class="tabs-blinds__slat" style="--k:5"></span>
    </span>
  </div>
</div>
