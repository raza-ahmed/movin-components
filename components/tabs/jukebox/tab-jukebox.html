<div class="tabs-jukebox">
  <span class="tabs-jukebox__deck" aria-hidden="true">
    <span class="tabs-jukebox__record" data-on="" style="--tabs-jukebox-c:light-dark(#42454c, #e5e6e9)">
      <span class="tabs-jukebox__disc"></span>
    </span>
    <span class="tabs-jukebox__arm"></span>
  </span>
  <div class="tabs-jukebox__list" role="tablist" aria-label="Songs" aria-orientation="vertical">
    <button class="tabs-jukebox__tab" type="button" role="tab" id="tabs-jukebox-tab-0" aria-selected="true" aria-controls="tabs-jukebox-panel-0" tabindex="0"><span class="tabs-jukebox__code">A1</span>Night Drive</button>
    <button class="tabs-jukebox__tab" type="button" role="tab" id="tabs-jukebox-tab-1" aria-selected="false" aria-controls="tabs-jukebox-panel-1" tabindex="-1"><span class="tabs-jukebox__code">B4</span>Paper Moon</button>
    <button class="tabs-jukebox__tab" type="button" role="tab" id="tabs-jukebox-tab-2" aria-selected="false" aria-controls="tabs-jukebox-panel-2" tabindex="-1"><span class="tabs-jukebox__code">C2</span>Slow Train</button>
  </div>
  <div class="tabs-jukebox__panel" role="tabpanel" id="tabs-jukebox-panel-0" aria-labelledby="tabs-jukebox-tab-0">
    <span class="tabs-jukebox__eq" aria-hidden="true">
      <span></span>
      <span style="animation-delay:-0.15s"></span>
      <span style="animation-delay:-0.3s"></span>
    </span>
    <span>
      <span class="tabs-jukebox__song">Night Drive</span>
      <span class="tabs-jukebox__artist">by The Lumens</span>
    </span>
  </div>
  <div class="tabs-jukebox__panel" role="tabpanel" id="tabs-jukebox-panel-1" aria-labelledby="tabs-jukebox-tab-1" hidden="">
    <span class="tabs-jukebox__eq" aria-hidden="true">
      <span></span>
      <span style="animation-delay:-0.15s"></span>
      <span style="animation-delay:-0.3s"></span>
    </span>
    <span>
      <span class="tabs-jukebox__song">Paper Moon</span>
      <span class="tabs-jukebox__artist">by Ida Grey</span>
    </span>
  </div>
  <div class="tabs-jukebox__panel" role="tabpanel" id="tabs-jukebox-panel-2" aria-labelledby="tabs-jukebox-tab-2" hidden="">
    <span class="tabs-jukebox__eq" aria-hidden="true">
      <span></span>
      <span style="animation-delay:-0.15s"></span>
      <span style="animation-delay:-0.3s"></span>
    </span>
    <span>
      <span class="tabs-jukebox__song">Slow Train</span>
      <span class="tabs-jukebox__artist">by Marlow &amp; Co</span>
    </span>
  </div>
</div>
