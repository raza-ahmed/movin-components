<div class="tabs-clock" style="--tabs-clock-t:570">
  <div class="tabs-clock__list" role="tablist" aria-label="City">
    <button class="tabs-clock__tab" type="button" role="tab" id="tabs-clock-tab-0" aria-selected="true" aria-controls="tabs-clock-panel-0" tabindex="0">London</button>
    <button class="tabs-clock__tab" type="button" role="tab" id="tabs-clock-tab-1" aria-selected="false" aria-controls="tabs-clock-panel-1" tabindex="-1">Tokyo</button>
    <button class="tabs-clock__tab" type="button" role="tab" id="tabs-clock-tab-2" aria-selected="false" aria-controls="tabs-clock-panel-2" tabindex="-1">New York</button>
  </div>
  <div class="tabs-clock__row">
    <span class="tabs-clock__face" aria-hidden="true">
      <span class="tabs-clock__tick" style="--k:0"></span>
      <span class="tabs-clock__tick" style="--k:1"></span>
      <span class="tabs-clock__tick" style="--k:2"></span>
      <span class="tabs-clock__tick" style="--k:3"></span>
      <span class="tabs-clock__tick" style="--k:4"></span>
      <span class="tabs-clock__tick" style="--k:5"></span>
      <span class="tabs-clock__tick" style="--k:6"></span>
      <span class="tabs-clock__tick" style="--k:7"></span>
      <span class="tabs-clock__tick" style="--k:8"></span>
      <span class="tabs-clock__tick" style="--k:9"></span>
      <span class="tabs-clock__tick" style="--k:10"></span>
      <span class="tabs-clock__tick" style="--k:11"></span>
      <span class="tabs-clock__hand tabs-clock__hand--h"></span>
      <span class="tabs-clock__hand tabs-clock__hand--m"></span>
      <span class="tabs-clock__pin"></span>
    </span>
    <div class="tabs-clock__panel" role="tabpanel" id="tabs-clock-panel-0" aria-labelledby="tabs-clock-tab-0">
      <span class="tabs-clock__time">09:30</span>
      <span class="tabs-clock__note">Morning. The office is filling up.</span>
    </div>
    <div class="tabs-clock__panel" role="tabpanel" id="tabs-clock-panel-1" aria-labelledby="tabs-clock-tab-1" hidden="">
      <span class="tabs-clock__time">17:30</span>
      <span class="tabs-clock__note">Evening. Eight hours ahead of London.</span>
    </div>
    <div class="tabs-clock__panel" role="tabpanel" id="tabs-clock-panel-2" aria-labelledby="tabs-clock-tab-2" hidden="">
      <span class="tabs-clock__time">04:30</span>
      <span class="tabs-clock__note">Before dawn. Wait a few hours to call.</span>
    </div>
  </div>
</div>
