<div class="tabs-envelope">
  <div class="tabs-envelope__list" role="tablist" aria-label="Letters">
    <button class="tabs-envelope__tab" type="button" role="tab" id="tabs-envelope-tab-0" aria-selected="true" aria-controls="tabs-envelope-panel-0" tabindex="0" style="--tabs-envelope-tilt:-4deg">Mia</button>
    <button class="tabs-envelope__tab" type="button" role="tab" id="tabs-envelope-tab-1" aria-selected="false" aria-controls="tabs-envelope-panel-1" tabindex="-1" style="--tabs-envelope-tilt:3deg">Theo</button>
    <button class="tabs-envelope__tab" type="button" role="tab" id="tabs-envelope-tab-2" aria-selected="false" aria-controls="tabs-envelope-panel-2" tabindex="-1" style="--tabs-envelope-tilt:-2deg">Ava</button>
  </div>
  <div class="tabs-envelope__scene">
    <span class="tabs-envelope__flap" aria-hidden="true"></span>
    <span class="tabs-envelope__back" aria-hidden="true"></span>
    <div class="tabs-envelope__letter" role="tabpanel" id="tabs-envelope-panel-0" aria-labelledby="tabs-envelope-tab-0"><span class="tabs-envelope__from">From Mia</span>Lisbon is all hills and tiled walls. A postcard is on its way.</div>
    <div class="tabs-envelope__letter" role="tabpanel" id="tabs-envelope-panel-1" aria-labelledby="tabs-envelope-tab-1" hidden=""><span class="tabs-envelope__from">From Theo</span>The band played our song last night. Wish you were there.</div>
    <div class="tabs-envelope__letter" role="tabpanel" id="tabs-envelope-panel-2" aria-labelledby="tabs-envelope-tab-2" hidden=""><span class="tabs-envelope__from">From Ava</span>Snow at last! The cabin smells of pine and toast.</div>
    <span class="tabs-envelope__pocket" aria-hidden="true"></span>
  </div>
</div>
