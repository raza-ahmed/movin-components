<div class="tabs-curtain">
  <div class="tabs-curtain__list" role="tablist" aria-label="Acts">
    <button class="tabs-curtain__tab" type="button" role="tab" id="tabs-curtain-tab-0" aria-selected="true" aria-controls="tabs-curtain-panel-0" tabindex="0">Act I</button>
    <button class="tabs-curtain__tab" type="button" role="tab" id="tabs-curtain-tab-1" aria-selected="false" aria-controls="tabs-curtain-panel-1" tabindex="-1">Act II</button>
    <button class="tabs-curtain__tab" type="button" role="tab" id="tabs-curtain-tab-2" aria-selected="false" aria-controls="tabs-curtain-panel-2" tabindex="-1">Act III</button>
  </div>
  <div class="tabs-curtain__stage">
    <div class="tabs-curtain__panel" role="tabpanel" id="tabs-curtain-panel-0" aria-labelledby="tabs-curtain-tab-0" data-on="">
      <span class="tabs-curtain__title">The arrival</span>
      <span class="tabs-curtain__body">A stranger steps off the last train.</span>
    </div>
    <div class="tabs-curtain__panel" role="tabpanel" id="tabs-curtain-panel-1" aria-labelledby="tabs-curtain-tab-1" hidden="">
      <span class="tabs-curtain__title">The storm</span>
      <span class="tabs-curtain__body">The lights go out across the town.</span>
    </div>
    <div class="tabs-curtain__panel" role="tabpanel" id="tabs-curtain-panel-2" aria-labelledby="tabs-curtain-tab-2" hidden="">
      <span class="tabs-curtain__title">The return</span>
      <span class="tabs-curtain__body">Morning, and one empty chair.</span>
    </div>
    <span class="tabs-curtain__drape tabs-curtain__drape--l" aria-hidden="true"></span>
    <span class="tabs-curtain__drape tabs-curtain__drape--r" aria-hidden="true"></span>
    <span class="tabs-curtain__valance" aria-hidden="true"></span>
  </div>
</div>
