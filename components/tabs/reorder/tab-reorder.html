<div class="tabs-reorder">
  <div class="tabs-reorder__list" role="tablist" aria-label="Lists, Alt and arrow keys to reorder">
    <button class="tabs-reorder__tab" type="button" role="tab" id="tabs-reorder-tab-inbox" aria-selected="false" aria-controls="tabs-reorder-panel-inbox" tabindex="-1">
      <svg class="tabs-reorder__grip" viewBox="0 0 6 10" aria-hidden="true">
        <g>
          <circle cx="1.2" cy="1" r="1.1"></circle>
          <circle cx="4.8" cy="1" r="1.1"></circle>
        </g>
        <g>
          <circle cx="1.2" cy="5" r="1.1"></circle>
          <circle cx="4.8" cy="5" r="1.1"></circle>
        </g>
        <g>
          <circle cx="1.2" cy="9" r="1.1"></circle>
          <circle cx="4.8" cy="9" r="1.1"></circle>
        </g>
      </svg>
      Inbox
    </button>
    <button class="tabs-reorder__tab" type="button" role="tab" id="tabs-reorder-tab-today" aria-selected="true" aria-controls="tabs-reorder-panel-today" tabindex="0">
      <svg class="tabs-reorder__grip" viewBox="0 0 6 10" aria-hidden="true">
        <g>
          <circle cx="1.2" cy="1" r="1.1"></circle>
          <circle cx="4.8" cy="1" r="1.1"></circle>
        </g>
        <g>
          <circle cx="1.2" cy="5" r="1.1"></circle>
          <circle cx="4.8" cy="5" r="1.1"></circle>
        </g>
        <g>
          <circle cx="1.2" cy="9" r="1.1"></circle>
          <circle cx="4.8" cy="9" r="1.1"></circle>
        </g>
      </svg>
      Today
    </button>
    <button class="tabs-reorder__tab" type="button" role="tab" id="tabs-reorder-tab-later" aria-selected="false" aria-controls="tabs-reorder-panel-later" tabindex="-1">
      <svg class="tabs-reorder__grip" viewBox="0 0 6 10" aria-hidden="true">
        <g>
          <circle cx="1.2" cy="1" r="1.1"></circle>
          <circle cx="4.8" cy="1" r="1.1"></circle>
        </g>
        <g>
          <circle cx="1.2" cy="5" r="1.1"></circle>
          <circle cx="4.8" cy="5" r="1.1"></circle>
        </g>
        <g>
          <circle cx="1.2" cy="9" r="1.1"></circle>
          <circle cx="4.8" cy="9" r="1.1"></circle>
        </g>
      </svg>
      Later
    </button>
    <button class="tabs-reorder__tab" type="button" role="tab" id="tabs-reorder-tab-done" aria-selected="false" aria-controls="tabs-reorder-panel-done" tabindex="-1">
      <svg class="tabs-reorder__grip" viewBox="0 0 6 10" aria-hidden="true">
        <g>
          <circle cx="1.2" cy="1" r="1.1"></circle>
          <circle cx="4.8" cy="1" r="1.1"></circle>
        </g>
        <g>
          <circle cx="1.2" cy="5" r="1.1"></circle>
          <circle cx="4.8" cy="5" r="1.1"></circle>
        </g>
        <g>
          <circle cx="1.2" cy="9" r="1.1"></circle>
          <circle cx="4.8" cy="9" r="1.1"></circle>
        </g>
      </svg>
      Done
    </button>
  </div>
  <span class="tabs-reorder__live" aria-live="polite"></span>
  <div class="tabs-reorder__panel" role="tabpanel" id="tabs-reorder-panel-inbox" aria-labelledby="tabs-reorder-tab-inbox" hidden="">Eleven tasks waiting to be sorted.</div>
  <div class="tabs-reorder__panel" role="tabpanel" id="tabs-reorder-panel-today" aria-labelledby="tabs-reorder-tab-today">Four tasks, the first at ten.</div>
  <div class="tabs-reorder__panel" role="tabpanel" id="tabs-reorder-panel-later" aria-labelledby="tabs-reorder-tab-later" hidden="">Seven tasks parked for next week.</div>
  <div class="tabs-reorder__panel" role="tabpanel" id="tabs-reorder-panel-done" aria-labelledby="tabs-reorder-tab-done" hidden="">Twenty-three finished this month.</div>
</div>
