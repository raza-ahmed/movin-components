<div class="tabs-develop" style="--i:0;--p:0">
  <div class="tabs-develop__list" role="tablist" aria-label="Trip">
    <button class="tabs-develop__tab" type="button" role="tab" id="tabs-develop-tab-0" aria-selected="true" aria-controls="tabs-develop-panel-0" tabindex="0">Coast</button>
    <button class="tabs-develop__tab" type="button" role="tab" id="tabs-develop-tab-1" aria-selected="false" aria-controls="tabs-develop-panel-1" tabindex="-1">Hills</button>
    <button class="tabs-develop__tab" type="button" role="tab" id="tabs-develop-tab-2" aria-selected="false" aria-controls="tabs-develop-panel-2" tabindex="-1">City</button>
  </div>
  <div class="tabs-develop__panel" role="tabpanel" id="tabs-develop-panel-0" aria-labelledby="tabs-develop-tab-0">
    <div class="tabs-develop__photo">
      <span class="tabs-develop__img" data-scene="coast" role="img" aria-label="Photo: Cliffs, Sunday"></span>
    </div>
    <span class="tabs-develop__caption">Cliffs, Sunday</span>
  </div>
  <div class="tabs-develop__panel" role="tabpanel" id="tabs-develop-panel-1" aria-labelledby="tabs-develop-tab-1" hidden="">
    <div class="tabs-develop__photo">
      <span class="tabs-develop__img" data-scene="hills" role="img" aria-label="Photo: Morning walk"></span>
    </div>
    <span class="tabs-develop__caption">Morning walk</span>
  </div>
  <div class="tabs-develop__panel" role="tabpanel" id="tabs-develop-panel-2" aria-labelledby="tabs-develop-tab-2" hidden="">
    <div class="tabs-develop__photo">
      <span class="tabs-develop__img" data-scene="city" role="img" aria-label="Photo: Last night out"></span>
    </div>
    <span class="tabs-develop__caption">Last night out</span>
  </div>
</div>
