<div class="field-detent">
  <div class="field-detent__head">
    <span id="field-detent-label" class="field-detent__label">Size</span>
    <span class="field-detent__name">Medium</span>
  </div>
  <div class="field-detent__rail" role="slider" tabindex="0" aria-labelledby="field-detent-label" aria-valuemin="0" aria-valuemax="4" aria-valuenow="2" aria-valuetext="Medium">
    <span class="field-detent__line"></span>
    <span class="field-detent__fill" style="width:50%"></span>
    <span class="field-detent__stop" data-on="true" style="left:0%"></span>
    <span class="field-detent__stop" data-on="true" style="left:25%"></span>
    <span class="field-detent__stop" data-on="true" style="left:50%"></span>
    <span class="field-detent__stop" style="left:75%"></span>
    <span class="field-detent__stop" style="left:100%"></span>
    <span class="field-detent__thumb" style="left:50%"></span>
  </div>
  <div class="field-detent__ticks" aria-hidden="true">
    <span>XS</span>
    <span>S</span>
    <span data-on="true">M</span>
    <span>L</span>
    <span>XL</span>
  </div>
</div>
