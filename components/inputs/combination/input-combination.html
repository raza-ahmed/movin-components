<div class="field-combination">
  <div class="field-combination__safe">
    <span class="field-combination__marker" aria-hidden="true"></span>
    <div class="field-combination__dial" role="slider" tabindex="0" aria-label="Dial, turn right" aria-valuemin="0" aria-valuemax="39" aria-valuenow="0" style="transform:rotate(0deg)">
      <span class="field-combination__n" aria-hidden="true" style="transform:rotate(0deg) translateY(-48px)">0</span>
      <span class="field-combination__n" aria-hidden="true" style="transform:rotate(45deg) translateY(-48px)">5</span>
      <span class="field-combination__n" aria-hidden="true" style="transform:rotate(90deg) translateY(-48px)">10</span>
      <span class="field-combination__n" aria-hidden="true" style="transform:rotate(135deg) translateY(-48px)">15</span>
      <span class="field-combination__n" aria-hidden="true" style="transform:rotate(180deg) translateY(-48px)">20</span>
      <span class="field-combination__n" aria-hidden="true" style="transform:rotate(225deg) translateY(-48px)">25</span>
      <span class="field-combination__n" aria-hidden="true" style="transform:rotate(270deg) translateY(-48px)">30</span>
      <span class="field-combination__n" aria-hidden="true" style="transform:rotate(315deg) translateY(-48px)">35</span>
      <span class="field-combination__grip"></span>
    </div>
  </div>
  <div class="field-combination__side">
    <div class="field-combination__top">
      <span class="field-combination__label">Combination</span>
      <button type="button" class="field-combination__info" aria-label="Turn the dial, then Enter" data-tip="Turn the dial, then Enter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 11v5M12 7.5v.01"></path>
        </svg>
      </button>
    </div>
    <div class="field-combination__slots" aria-live="polite" aria-label="Entered: none">
      <span class="field-combination__slot" data-next="true">0</span>
      <span class="field-combination__slot"></span>
      <span class="field-combination__slot"></span>
    </div>
    <button type="button" class="field-combination__set">Enter 0</button>
    <span class="field-combination__bolt" aria-hidden="true">
      <span></span>
    </span>
    <span class="field-combination__hint"></span>
  </div>
</div>
