<div class="field-scramble" role="group" aria-labelledby="field-scramble-label">
  <div class="field-scramble__head">
    <div class="field-scramble__top">
      <span id="field-scramble-label" class="field-scramble__label">PIN</span>
      <button type="button" class="field-scramble__info" aria-label="Keys shuffle after each press" data-tip="Keys shuffle after each press">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 11v5M12 7.5v.01"></path>
        </svg>
      </button>
    </div>
    <span class="field-scramble__dots" aria-label="0 of 4 digits entered" role="img">
      <span class="field-scramble__dot"></span>
      <span class="field-scramble__dot"></span>
      <span class="field-scramble__dot"></span>
      <span class="field-scramble__dot"></span>
    </span>
  </div>
  <div class="field-scramble__pad">
    <button type="button" class="field-scramble__key" style="transform:translate(59px, 132px)">0</button>
    <button type="button" class="field-scramble__key" style="transform:translate(0px, 0px)">1</button>
    <button type="button" class="field-scramble__key" style="transform:translate(59px, 0px)">2</button>
    <button type="button" class="field-scramble__key" style="transform:translate(118px, 0px)">3</button>
    <button type="button" class="field-scramble__key" style="transform:translate(0px, 44px)">4</button>
    <button type="button" class="field-scramble__key" style="transform:translate(59px, 44px)">5</button>
    <button type="button" class="field-scramble__key" style="transform:translate(118px, 44px)">6</button>
    <button type="button" class="field-scramble__key" style="transform:translate(0px, 88px)">7</button>
    <button type="button" class="field-scramble__key" style="transform:translate(59px, 88px)">8</button>
    <button type="button" class="field-scramble__key" style="transform:translate(118px, 88px)">9</button>
    <button type="button" class="field-scramble__key" data-fn="true" style="transform:translate(0px, 132px)">Clear</button>
    <button type="button" class="field-scramble__key" data-fn="true" aria-label="Delete" style="transform:translate(118px, 132px)">⌫</button>
  </div>
  <div class="field-scramble__status" aria-live="polite"></div>
</div>
