<div class="field-convert">
  <div class="field-convert__top">
    <label class="field-convert__label" for="field-convert-input">Convert</label>
    <button type="button" class="field-convert__info" aria-label="Try 12 mi, 70 kg or 21 °C" data-tip="Try 12 mi, 70 kg or 21 °C">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11v5M12 7.5v.01"></path>
      </svg>
    </button>
  </div>
  <input id="field-convert-input" class="field-convert__input" autoComplete="off" spellCheck="false" value="5 km"/>
  <div class="field-convert__rows" aria-live="polite">
    <div class="field-convert__row" style="animation-delay:0ms">
      <b>5,000 m</b>
      <span>metres</span>
    </div>
    <div class="field-convert__row" style="animation-delay:50ms">
      <b>3.11 mi</b>
      <span>miles</span>
    </div>
    <div class="field-convert__row" style="animation-delay:100ms">
      <b>16,404.2 ft</b>
      <span>feet</span>
    </div>
  </div>
</div>
