<div class="field-heat">
  <div class="field-heat__head">
    <label class="field-heat__label" for="field-heat-input">Message</label>
    <span class="field-heat__wpm" aria-hidden="true">0 wpm</span>
  </div>
  <div class="field-heat__box">
    <span class="field-heat__mirror" aria-hidden="true"></span>
    <input id="field-heat-input" class="field-heat__input" maxLength="30" placeholder="Type fast to heat it up" autoComplete="off" spellCheck="false" value=""/>
  </div>
  <div class="field-heat__meter" aria-hidden="true">
    <span style="transform:scaleX(0)"></span>
  </div>
</div>
