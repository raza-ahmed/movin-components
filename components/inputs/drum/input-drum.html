<div class="field-drum" role="group" aria-labelledby="field-drum-label">
  <span id="field-drum-label" class="field-drum__label">Alarm · 7:30 AM</span>
  <div class="field-drum__body">
    <span class="field-drum__lens"></span>
    <div class="field-drum__wheel " role="spinbutton" tabindex="0" aria-label="Hour" aria-valuetext="7">
      <div class="field-drum__cyl" data-snap="true" style="transform:translateZ(-55.98px) rotateX(180deg)">
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-360deg) translateZ(55.98px);opacity:0">1</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-30deg) translateZ(55.98px);opacity:0">2</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-60deg) translateZ(55.98px);opacity:0">3</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-90deg) translateZ(55.98px);opacity:0">4</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-120deg) translateZ(55.98px);opacity:0.455">5</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-150deg) translateZ(55.98px);opacity:0.727">6</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-180deg) translateZ(55.98px);opacity:1">7</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-210deg) translateZ(55.98px);opacity:0.727">8</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-240deg) translateZ(55.98px);opacity:0.455">9</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-270deg) translateZ(55.98px);opacity:0">10</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-300deg) translateZ(55.98px);opacity:0">11</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-330deg) translateZ(55.98px);opacity:0">12</div>
      </div>
    </div>
    <span class="field-drum__colon" aria-hidden="true">:</span>
    <div class="field-drum__wheel " role="spinbutton" tabindex="0" aria-label="Minute" aria-valuetext="30">
      <div class="field-drum__cyl" data-snap="true" style="transform:translateZ(-55.98px) rotateX(180deg)">
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-360deg) translateZ(55.98px);opacity:0">00</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-30deg) translateZ(55.98px);opacity:0">05</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-60deg) translateZ(55.98px);opacity:0">10</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-90deg) translateZ(55.98px);opacity:0">15</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-120deg) translateZ(55.98px);opacity:0.455">20</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-150deg) translateZ(55.98px);opacity:0.727">25</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-180deg) translateZ(55.98px);opacity:1">30</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-210deg) translateZ(55.98px);opacity:0.727">35</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-240deg) translateZ(55.98px);opacity:0.455">40</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-270deg) translateZ(55.98px);opacity:0">45</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-300deg) translateZ(55.98px);opacity:0">50</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-330deg) translateZ(55.98px);opacity:0">55</div>
      </div>
    </div>
    <div class="field-drum__wheel field-drum__wheel--ampm" role="spinbutton" tabindex="0" aria-label="AM or PM" aria-valuetext="AM">
      <div class="field-drum__cyl" data-snap="true" style="transform:translateZ(-70.57px) rotateX(0deg)">
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(0deg) translateZ(70.57px);opacity:1">AM</div>
        <div class="field-drum__item" aria-hidden="true" style="transform:rotateX(-24deg) translateZ(70.57px);opacity:0.782">PM</div>
      </div>
    </div>
    <span class="field-drum__fade"></span>
  </div>
</div>
