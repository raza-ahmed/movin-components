<div class="field-match">
  <label class="field-match__label" for="field-match-a">New password</label>
  <input id="field-match-a" class="field-match__input" type="password" placeholder="At least 8 characters" autoComplete="new-password" value=""/>
  <div class="field-match__chain">
    <span id="field-match-s" class="field-match__status" aria-live="polite"></span>
  </div>
  <label class="field-match__label" for="field-match-b">Confirm password</label>
  <input id="field-match-b" class="field-match__input" type="password" aria-describedby="field-match-s" aria-invalid="false" autoComplete="new-password" value=""/>
</div>
