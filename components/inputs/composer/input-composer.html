<div class="field-composer">
  <div class="field-composer__thread" role="log" aria-label="Messages">
    <div class="field-composer__msg">Did the build pass?</div>
    <div class="field-composer__msg field-composer__msg--mine">All green. Shipping now</div>
  </div>
  <div class="field-composer__box">
    <textarea class="field-composer__input" rows="1" placeholder="Write a message" aria-label="Message"></textarea>
    <button class="field-composer__send" type="button" aria-label="Send" aria-disabled="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M3.5 7.5 8 3l4.5 4.5" /></svg>
    </button>
  </div>
</div>
