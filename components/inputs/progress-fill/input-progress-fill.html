<div class="field-progress-fill" data-target="30">
  <div class="field-progress-fill__box">
    <span class="field-progress-fill__bar" aria-hidden="true"></span>
    <input class="field-progress-fill__input" type="text" placeholder="Write 30 chars…" aria-label="Your text">
  </div>
  <div class="field-progress-fill__meta">
    <span class="field-progress-fill__count">0 / 30</span>
    <span class="field-progress-fill__done" hidden>Complete &#10003;</span>
  </div>
</div>
