<div class="field-signature">
  <span class="field-signature__probe" aria-hidden="true"></span>
  <div class="field-signature__head">
    <span class="field-signature__label" id="field-signature-label">Signature</span>
    <button type="button" class="field-signature__clear">Clear</button>
  </div>
  <div class="field-signature__pad" role="img" aria-labelledby="field-signature-label" aria-describedby="field-signature-status">
    <canvas aria-hidden="true"></canvas>
    <span class="field-signature__x" aria-hidden="true">×</span>
    <span class="field-signature__line" aria-hidden="true"></span>
  </div>
  <div class="field-signature__foot">
    <input class="field-signature__alt" placeholder="or type your name" aria-label="Type your name to sign" value=""/>
    <span id="field-signature-status" aria-live="polite"></span>
  </div>
</div>
