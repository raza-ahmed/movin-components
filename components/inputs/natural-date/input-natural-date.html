<div class="field-natural-date">
  <div class="field-natural-date__top">
    <label class="field-natural-date__label" for="field-natural-date-input">Remind me</label>
    <button type="button" class="field-natural-date__info" aria-label="Try tomorrow 9am or sat noon" data-tip="Try tomorrow 9am or sat noon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11v5M12 7.5v.01"></path>
      </svg>
    </button>
  </div>
  <input id="field-natural-date-input" class="field-natural-date__input" placeholder="tomorrow 9am" autoComplete="off" spellCheck="false" value="next fri 3pm"/>
  <div class="field-natural-date__out" aria-live="polite"></div>
</div>
