<div class="field-dial-time">
  <span class="field-dial-time__clock" aria-hidden="true" style="--h:305deg;--m:60deg">
    <span class="field-dial-time__tick" style="--k:0"></span>
    <span class="field-dial-time__tick" style="--k:1"></span>
    <span class="field-dial-time__tick" style="--k:2"></span>
    <span class="field-dial-time__tick" style="--k:3"></span>
    <span class="field-dial-time__tick" style="--k:4"></span>
    <span class="field-dial-time__tick" style="--k:5"></span>
    <span class="field-dial-time__tick" style="--k:6"></span>
    <span class="field-dial-time__tick" style="--k:7"></span>
    <span class="field-dial-time__tick" style="--k:8"></span>
    <span class="field-dial-time__tick" style="--k:9"></span>
    <span class="field-dial-time__tick" style="--k:10"></span>
    <span class="field-dial-time__tick" style="--k:11"></span>
    <span class="field-dial-time__hand field-dial-time__hand--h"></span>
    <span class="field-dial-time__hand field-dial-time__hand--m"></span>
    <span class="field-dial-time__pin"></span>
  </span>
  <div class="field-dial-time__field">
    <label class="field-dial-time__label" for="field-dial-time">Pickup time</label>
    <input id="field-dial-time" class="field-dial-time__input" inputMode="numeric" placeholder="09:30" aria-invalid="false" aria-describedby="field-dial-time-part" value=""/>
    <span id="field-dial-time-part" class="field-dial-time__part" aria-live="polite">Type a 24-hour time</span>
  </div>
</div>
