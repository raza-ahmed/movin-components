<div class="field-domain">
  <div class="field-domain__top">
    <label class="field-domain__label" for="field-domain-input">Email</label>
    <button type="button" class="field-domain__info" aria-label="Tab accepts, arrows cycle" data-tip="Tab accepts, arrows cycle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11v5M12 7.5v.01"></path>
      </svg>
    </button>
  </div>
  <div class="field-domain__box">
    <span class="field-domain__mirror" aria-hidden="true"><span class="field-domain__typed">sam@</span><span class="field-domain__ghost" style="--from:8px">gmail.com</span></span>
    <input id="field-domain-input" class="field-domain__input" type="text" inputMode="email" placeholder="you@studio.com" autoComplete="off" spellCheck="false" value="sam@"/>
  </div>
</div>
