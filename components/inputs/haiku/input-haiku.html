<div class="field-haiku" role="group" aria-label="Write a haiku">
  <div class="field-haiku__row">
    <input class="field-haiku__input" aria-label="Line 1, 5 syllables" aria-describedby="field-haiku-c0" placeholder="Morning light on glass" value=""/>
    <span class="field-haiku__beads" aria-hidden="true">
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
    </span>
    <span id="field-haiku-c0" class="field-haiku__over">
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">0 of 5 syllables</span>
    </span>
  </div>
  <div class="field-haiku__row">
    <input class="field-haiku__input" aria-label="Line 2, 7 syllables" aria-describedby="field-haiku-c1" placeholder="the kettle hums a low tune" value=""/>
    <span class="field-haiku__beads" aria-hidden="true">
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
    </span>
    <span id="field-haiku-c1" class="field-haiku__over">
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">0 of 7 syllables</span>
    </span>
  </div>
  <div class="field-haiku__row">
    <input class="field-haiku__input" aria-label="Line 3, 5 syllables" aria-describedby="field-haiku-c2" placeholder="steam writes, then is gone" value=""/>
    <span class="field-haiku__beads" aria-hidden="true">
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
      <span class="field-haiku__bead"></span>
    </span>
    <span id="field-haiku-c2" class="field-haiku__over">
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">0 of 5 syllables</span>
    </span>
  </div>
  <span class="field-haiku__seal" aria-live="polite"></span>
</div>
