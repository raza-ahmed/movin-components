<div class="field-telegraph">
  <div class="field-telegraph__top">
    <label class="field-telegraph__label" for="field-telegraph-out">Message</label>
    <button type="button" class="field-telegraph__info" aria-label="Tap for a dot, hold for a dash" data-tip="Tap for a dot, hold for a dash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11v5M12 7.5v.01"></path>
      </svg>
    </button>
  </div>
  <input id="field-telegraph-out" class="field-telegraph__out" value="HI "/>
  <div class="field-telegraph__tape" aria-hidden="true"></div>
  <div class="field-telegraph__row">
    <button type="button" class="field-telegraph__key" aria-label="Morse key: tap for a dot, hold for a dash">
      <span class="field-telegraph__base"></span>
      <span class="field-telegraph__lever">
        <span class="field-telegraph__knob"></span>
      </span>
    </button>
    <span class="field-telegraph__lamp" aria-hidden="true"></span>
  </div>
</div>
