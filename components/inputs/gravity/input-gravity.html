<div class="field-gravity">
  <div class="field-gravity__top">
    <label class="field-gravity__label" for="field-gravity-input">Caption</label>
    <button type="button" class="field-gravity__info" aria-label="Delete text to drop it" data-tip="Delete text to drop it">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11v5M12 7.5v.01"></path>
      </svg>
    </button>
  </div>
  <div class="field-gravity__box">
    <input id="field-gravity-input" class="field-gravity__input" spellCheck="false" autoComplete="off" value="Backspace sends these tumbling"/>
  </div>
</div>
