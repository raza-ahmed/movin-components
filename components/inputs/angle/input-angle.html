<div class="field-angle">
  <div class="field-angle__dial" role="slider" tabindex="0" aria-label="Gradient angle" aria-valuemin="0" aria-valuemax="359" aria-valuenow="135" aria-valuetext="135 degrees">
    <span class="field-angle__tick" data-major="true" style="--a:0deg"></span>
    <span class="field-angle__tick" style="--a:15deg"></span>
    <span class="field-angle__tick" style="--a:30deg"></span>
    <span class="field-angle__tick" data-major="true" style="--a:45deg"></span>
    <span class="field-angle__tick" style="--a:60deg"></span>
    <span class="field-angle__tick" style="--a:75deg"></span>
    <span class="field-angle__tick" data-major="true" style="--a:90deg"></span>
    <span class="field-angle__tick" style="--a:105deg"></span>
    <span class="field-angle__tick" style="--a:120deg"></span>
    <span class="field-angle__tick" data-major="true" data-near="true" style="--a:135deg"></span>
    <span class="field-angle__tick" style="--a:150deg"></span>
    <span class="field-angle__tick" style="--a:165deg"></span>
    <span class="field-angle__tick" data-major="true" style="--a:180deg"></span>
    <span class="field-angle__tick" style="--a:195deg"></span>
    <span class="field-angle__tick" style="--a:210deg"></span>
    <span class="field-angle__tick" data-major="true" style="--a:225deg"></span>
    <span class="field-angle__tick" style="--a:240deg"></span>
    <span class="field-angle__tick" style="--a:255deg"></span>
    <span class="field-angle__tick" data-major="true" style="--a:270deg"></span>
    <span class="field-angle__tick" style="--a:285deg"></span>
    <span class="field-angle__tick" style="--a:300deg"></span>
    <span class="field-angle__tick" data-major="true" style="--a:315deg"></span>
    <span class="field-angle__tick" style="--a:330deg"></span>
    <span class="field-angle__tick" style="--a:345deg"></span>
    <span class="field-angle__hand" style="transform:rotate(135deg)">
      <span class="field-angle__knob"></span>
    </span>
    <span class="field-angle__hub"></span>
  </div>
  <div class="field-angle__side">
    <label class="field-angle__label" for="field-angle-num">Gradient angle</label>
    <div class="field-angle__num">
      <input id="field-angle-num" type="number" min="0" max="359" value="135"/>
      <span aria-hidden="true">°</span>
    </div>
    <div class="field-angle__swatch" style="background:linear-gradient(135deg, light-dark(#373a40, #f1f2f3), light-dark(#ebedf0, #232529))" aria-hidden="true"></div>
  </div>
</div>
