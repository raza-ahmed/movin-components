<div class="radio-floor">
  <span class="radio-floor__shaft" aria-hidden="true">
    <span class="radio-floor__car">
      <span class="radio-floor__door radio-floor__door--l"></span>
      <span class="radio-floor__door radio-floor__door--r"></span>
    </span>
  </span>
  <div class="radio-floor__panel" role="radiogroup" aria-label="Floor">
    <label class="radio-floor__button">
      <input class="radio-floor__input" type="radio" aria-label="Floor 3" name="radio-floor" value="3"/>
      <span aria-hidden="true">3</span>
    </label>
    <label class="radio-floor__button">
      <input class="radio-floor__input" type="radio" aria-label="Floor 2" name="radio-floor" value="2"/>
      <span aria-hidden="true">2</span>
    </label>
    <label class="radio-floor__button">
      <input class="radio-floor__input" type="radio" aria-label="Floor 1" name="radio-floor" value="1"/>
      <span aria-hidden="true">1</span>
    </label>
    <label class="radio-floor__button">
      <input class="radio-floor__input" type="radio" aria-label="Ground floor" name="radio-floor" checked="" value="0"/>
      <span aria-hidden="true">G</span>
    </label>
  </div>
</div>
