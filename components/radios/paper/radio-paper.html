<div class="radio-paper">
  <div class="radio-paper__desk" aria-hidden="true">
    <span class="radio-paper__ghost" style="width:37px;height:52px"></span>
    <span class="radio-paper__ghost" style="width:52px;height:74px"></span>
    <span class="radio-paper__ghost" style="width:74px;height:104px"></span>
    <span class="radio-paper__sheet"></span>
  </div>
  <span class="radio-paper__read" aria-hidden="true">
    <span>148 × 210 mm</span>
    <span>210 × 297 mm</span>
    <span>297 × 420 mm</span>
  </span>
  <div class="radio-paper__opts" role="radiogroup" aria-label="Paper size">
    <label class="radio-paper__opt"><input class="radio-paper__input" type="radio" name="radio-paper" value="a5"/>A5</label>
    <label class="radio-paper__opt"><input class="radio-paper__input" type="radio" name="radio-paper" checked="" value="a4"/>A4</label>
    <label class="radio-paper__opt"><input class="radio-paper__input" type="radio" name="radio-paper" value="a3"/>A3</label>
  </div>
</div>
