<div class="radio-order">
  <span class="radio-order__list" aria-hidden="true">
    <span class="radio-order__row" style="--radio-order-a:0;--radio-order-p:2;--radio-order-r:1">
      <span class="radio-order__name">Apple</span>
      <span class="radio-order__price">£3.20</span>
      <span class="radio-order__rating">4.6★</span>
    </span>
    <span class="radio-order__row" style="--radio-order-a:1;--radio-order-p:3;--radio-order-r:0">
      <span class="radio-order__name">Fig</span>
      <span class="radio-order__price">£5.10</span>
      <span class="radio-order__rating">4.9★</span>
    </span>
    <span class="radio-order__row" style="--radio-order-a:2;--radio-order-p:0;--radio-order-r:3">
      <span class="radio-order__name">Kiwi</span>
      <span class="radio-order__price">£1.80</span>
      <span class="radio-order__rating">3.9★</span>
    </span>
    <span class="radio-order__row" style="--radio-order-a:3;--radio-order-p:1;--radio-order-r:2">
      <span class="radio-order__name">Plum</span>
      <span class="radio-order__price">£2.40</span>
      <span class="radio-order__rating">4.2★</span>
    </span>
  </span>
  <div class="radio-order__opts" role="radiogroup" aria-label="Sort by">
    <label class="radio-order__opt"><input class="radio-order__input" type="radio" name="radio-order" checked="" value="name"/>Name</label>
    <label class="radio-order__opt"><input class="radio-order__input" type="radio" name="radio-order" value="price"/>Price</label>
    <label class="radio-order__opt"><input class="radio-order__input" type="radio" name="radio-order" value="rating"/>Rating</label>
  </div>
</div>
