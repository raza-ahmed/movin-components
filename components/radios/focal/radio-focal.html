<div class="radio-focal">
  <div class="radio-focal__plan" aria-hidden="true">
    <span class="radio-focal__cone"></span>
    <span class="radio-focal__edge radio-focal__edge--l"></span>
    <span class="radio-focal__edge radio-focal__edge--r"></span>
    <span class="radio-focal__subject" style="left:34px;top:18px"></span>
    <span class="radio-focal__subject" style="left:70px;top:34px"></span>
    <span class="radio-focal__subject" style="left:100px;top:12px"></span>
    <span class="radio-focal__subject" style="left:128px;top:30px"></span>
    <span class="radio-focal__subject" style="left:166px;top:16px"></span>
    <span class="radio-focal__subject" style="left:100px;top:46px"></span>
    <span class="radio-focal__cam"></span>
  </div>
  <span class="radio-focal__read" aria-hidden="true">
    <span>84° field of view</span>
    <span>46° field of view</span>
    <span>28° field of view</span>
  </span>
  <div class="radio-focal__opts" role="radiogroup" aria-label="Lens">
    <label class="radio-focal__opt"><input class="radio-focal__input" type="radio" name="radio-focal" value="24"/>24 mm</label>
    <label class="radio-focal__opt"><input class="radio-focal__input" type="radio" name="radio-focal" checked="" value="50"/>50 mm</label>
    <label class="radio-focal__opt"><input class="radio-focal__input" type="radio" name="radio-focal" value="85"/>85 mm</label>
  </div>
</div>
