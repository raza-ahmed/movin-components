<div class="radio-typewriter" role="radiogroup" aria-label="Option">
  <label class="radio-typewriter__option">
    <input class="radio-typewriter__input" type="radio" name="radio-typewriter" value="Option Alpha" checked>
    <span class="radio-typewriter__ring"><span class="radio-typewriter__dot"></span></span>
    <span class="radio-typewriter__label"><span class="radio-typewriter__text">Option Alpha</span><span class="radio-typewriter__caret" aria-hidden="true">_</span></span>
  </label>
  <label class="radio-typewriter__option">
    <input class="radio-typewriter__input" type="radio" name="radio-typewriter" value="Option Beta">
    <span class="radio-typewriter__ring"><span class="radio-typewriter__dot"></span></span>
    <span class="radio-typewriter__label"><span class="radio-typewriter__text">Option Beta</span><span class="radio-typewriter__caret" aria-hidden="true">_</span></span>
  </label>
  <label class="radio-typewriter__option">
    <input class="radio-typewriter__input" type="radio" name="radio-typewriter" value="Option Gamma">
    <span class="radio-typewriter__ring"><span class="radio-typewriter__dot"></span></span>
    <span class="radio-typewriter__label"><span class="radio-typewriter__text">Option Gamma</span><span class="radio-typewriter__caret" aria-hidden="true">_</span></span>
  </label>
</div>
