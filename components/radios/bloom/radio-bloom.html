<div class="radio-bloom">
  <span class="radio-bloom__plant" aria-hidden="true">
    <span class="radio-bloom__stem"></span>
    <span class="radio-bloom__leaf" style="left:57px"></span>
    <span class="radio-bloom__leaf" style="left:36px;transform:scaleX(-1)"></span>
    <span class="radio-bloom__petal" style="--i:0;--o:3.5"></span>
    <span class="radio-bloom__petal" style="--i:1;--o:2.5"></span>
    <span class="radio-bloom__petal" style="--i:2;--o:1.5"></span>
    <span class="radio-bloom__petal" style="--i:3;--o:0.5"></span>
    <span class="radio-bloom__petal" style="--i:4;--o:0.5"></span>
    <span class="radio-bloom__petal" style="--i:5;--o:1.5"></span>
    <span class="radio-bloom__petal" style="--i:6;--o:2.5"></span>
    <span class="radio-bloom__petal" style="--i:7;--o:3.5"></span>
    <span class="radio-bloom__heart"></span>
  </span>
  <div class="radio-bloom__opts" role="radiogroup" aria-label="Stage">
    <label class="radio-bloom__opt"><input class="radio-bloom__input" type="radio" name="radio-bloom" checked="" value="bud"/>Bud</label>
    <label class="radio-bloom__opt"><input class="radio-bloom__input" type="radio" name="radio-bloom" value="half"/>Opening</label>
    <label class="radio-bloom__opt"><input class="radio-bloom__input" type="radio" name="radio-bloom" value="full"/>In bloom</label>
  </div>
</div>
