<div class="radio-pace">
  <div class="radio-pace__trail" aria-hidden="true">
    <span class="radio-pace__print" style="--k:0;--side:-1"></span>
    <span class="radio-pace__print" style="--k:1;--side:1"></span>
    <span class="radio-pace__print" style="--k:2;--side:-1"></span>
    <span class="radio-pace__print" style="--k:3;--side:1"></span>
    <span class="radio-pace__print" style="--k:4;--side:-1"></span>
    <span class="radio-pace__print" style="--k:5;--side:1"></span>
    <span class="radio-pace__print" style="--k:6;--side:-1"></span>
  </div>
  <span class="radio-pace__read" aria-hidden="true">
    <span>Walk, about 5 km/h</span>
    <span>Jog, about 9 km/h</span>
    <span>Run, about 14 km/h</span>
  </span>
  <div class="radio-pace__opts" role="radiogroup" aria-label="Pace">
    <label class="radio-pace__opt"><input class="radio-pace__input" type="radio" name="radio-pace" checked="" value="walk"/>Walk</label>
    <label class="radio-pace__opt"><input class="radio-pace__input" type="radio" name="radio-pace" value="jog"/>Jog</label>
    <label class="radio-pace__opt"><input class="radio-pace__input" type="radio" name="radio-pace" value="run"/>Run</label>
  </div>
</div>
