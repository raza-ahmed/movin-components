<div class="radio-cursor" role="radiogroup" aria-label="Theme">
  <span class="radio-cursor__pill" aria-hidden="true"></span>
  <label class="radio-cursor__option">
    <input class="radio-cursor__input" type="radio" name="radio-cursor" value="Photon" checked>
    <span class="radio-cursor__ring"><span class="radio-cursor__dot"></span></span>
    <span class="radio-cursor__label">Photon</span>
  </label>
  <label class="radio-cursor__option">
    <input class="radio-cursor__input" type="radio" name="radio-cursor" value="Nebula">
    <span class="radio-cursor__ring"><span class="radio-cursor__dot"></span></span>
    <span class="radio-cursor__label">Nebula</span>
  </label>
  <label class="radio-cursor__option">
    <input class="radio-cursor__input" type="radio" name="radio-cursor" value="Aurora">
    <span class="radio-cursor__ring"><span class="radio-cursor__dot"></span></span>
    <span class="radio-cursor__label">Aurora</span>
  </label>
</div>
