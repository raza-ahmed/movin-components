<div class="radio-aperture">
  <span class="radio-aperture__lens" aria-hidden="true">
    <span class="radio-aperture__iris">
      <span class="radio-aperture__blade" style="--i:0"></span>
      <span class="radio-aperture__blade" style="--i:1"></span>
      <span class="radio-aperture__blade" style="--i:2"></span>
      <span class="radio-aperture__blade" style="--i:3"></span>
      <span class="radio-aperture__blade" style="--i:4"></span>
      <span class="radio-aperture__blade" style="--i:5"></span>
    </span>
    <span class="radio-aperture__ring"></span>
  </span>
  <div class="radio-aperture__opts" role="radiogroup" aria-label="Aperture">
    <label class="radio-aperture__opt"><input class="radio-aperture__input" type="radio" name="radio-aperture" checked="" value="1.8"/>f/1.8</label>
    <label class="radio-aperture__opt"><input class="radio-aperture__input" type="radio" name="radio-aperture" value="4"/>f/4</label>
    <label class="radio-aperture__opt"><input class="radio-aperture__input" type="radio" name="radio-aperture" value="11"/>f/11</label>
  </div>
</div>
