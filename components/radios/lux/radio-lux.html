<div class="radio-lux">
  <div class="radio-lux__room" aria-hidden="true">
    <span class="radio-lux__beam"></span>
    <span class="radio-lux__pool"></span>
    <span class="radio-lux__cord"></span>
    <span class="radio-lux__shade"></span>
    <span class="radio-lux__bulb"></span>
    <span class="radio-lux__table"></span>
  </div>
  <span class="radio-lux__read" aria-hidden="true">
    <span>15% · reading nook</span>
    <span>50% · dinner</span>
    <span>100% · working</span>
  </span>
  <div class="radio-lux__opts" role="radiogroup" aria-label="Light level">
    <label class="radio-lux__opt"><input class="radio-lux__input" type="radio" name="radio-lux" value="dim"/>Dim</label>
    <label class="radio-lux__opt"><input class="radio-lux__input" type="radio" name="radio-lux" checked="" value="soft"/>Soft</label>
    <label class="radio-lux__opt"><input class="radio-lux__input" type="radio" name="radio-lux" value="bright"/>Bright</label>
  </div>
</div>
