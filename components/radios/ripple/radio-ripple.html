<div class="radio-ripple" role="radiogroup" aria-label="Intensity">
  <label class="radio-ripple__option">
    <input class="radio-ripple__input" type="radio" name="radio-ripple" value="Droplet" checked>
    <span class="radio-ripple__pond">
      <span class="radio-ripple__wave"></span>
      <span class="radio-ripple__wave"></span>
      <span class="radio-ripple__wave"></span>
      <span class="radio-ripple__ring"><span class="radio-ripple__dot"></span></span>
    </span>
    <span class="radio-ripple__label">Droplet</span>
  </label>
  <label class="radio-ripple__option">
    <input class="radio-ripple__input" type="radio" name="radio-ripple" value="Wave">
    <span class="radio-ripple__pond">
      <span class="radio-ripple__wave"></span>
      <span class="radio-ripple__wave"></span>
      <span class="radio-ripple__wave"></span>
      <span class="radio-ripple__ring"><span class="radio-ripple__dot"></span></span>
    </span>
    <span class="radio-ripple__label">Wave</span>
  </label>
  <label class="radio-ripple__option">
    <input class="radio-ripple__input" type="radio" name="radio-ripple" value="Surge">
    <span class="radio-ripple__pond">
      <span class="radio-ripple__wave"></span>
      <span class="radio-ripple__wave"></span>
      <span class="radio-ripple__wave"></span>
      <span class="radio-ripple__ring"><span class="radio-ripple__dot"></span></span>
    </span>
    <span class="radio-ripple__label">Surge</span>
  </label>
</div>
