<div class="radio-frost" role="radiogroup" aria-label="Climate">
  <span class="radio-frost__pill" aria-hidden="true"></span>
  <label class="radio-frost__option">
    <input class="radio-frost__input" type="radio" name="radio-frost" value="Glacier" checked>
    <span class="radio-frost__ring"><span class="radio-frost__dot"></span></span>
    <span class="radio-frost__label">Glacier</span>
  </label>
  <label class="radio-frost__option">
    <input class="radio-frost__input" type="radio" name="radio-frost" value="Tundra">
    <span class="radio-frost__ring"><span class="radio-frost__dot"></span></span>
    <span class="radio-frost__label">Tundra</span>
  </label>
  <label class="radio-frost__option">
    <input class="radio-frost__input" type="radio" name="radio-frost" value="Arctic">
    <span class="radio-frost__ring"><span class="radio-frost__dot"></span></span>
    <span class="radio-frost__label">Arctic</span>
  </label>
</div>
