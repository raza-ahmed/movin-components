<div class="radio-tide">
  <span class="radio-tide__scene" aria-hidden="true">
    <span class="radio-tide__pier"></span>
    <span class="radio-tide__deck"></span>
    <span class="radio-tide__mark" style="top:74px">
      <span>LOW</span>
    </span>
    <span class="radio-tide__mark" style="top:52px">
      <span>MID</span>
    </span>
    <span class="radio-tide__mark" style="top:28px">
      <span>HIGH</span>
    </span>
    <span class="radio-tide__sea">
      <span class="radio-tide__water"></span>
      <svg class="radio-tide__wave" viewBox="0 0 260 8" preserveAspectRatio="none">
        <path d="M0 4Q10 0 20 4T40 4T60 4T80 4T100 4T120 4T140 4T160 4T180 4T200 4T220 4T240 4T260 4V8H0Z"></path>
      </svg>
      <span class="radio-tide__buoy"></span>
    </span>
  </span>
  <div class="radio-tide__opts" role="radiogroup" aria-label="Tide">
    <label class="radio-tide__opt"><input class="radio-tide__input" type="radio" name="radio-tide" checked="" value="low"/>Low</label>
    <label class="radio-tide__opt"><input class="radio-tide__input" type="radio" name="radio-tide" value="mid"/>Mid</label>
    <label class="radio-tide__opt"><input class="radio-tide__input" type="radio" name="radio-tide" value="high"/>High</label>
  </div>
</div>
