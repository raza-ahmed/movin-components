<div class="radio-led" role="radiogroup" aria-label="Level">
  <label class="radio-led__option">
    <input class="radio-led__input" type="radio" name="radio-led" value="Low">
    <span class="radio-led__lamp"><span class="radio-led__core"></span></span>
    <span class="radio-led__label">Low</span>
  </label>
  <label class="radio-led__option">
    <input class="radio-led__input" type="radio" name="radio-led" value="Mid">
    <span class="radio-led__lamp"><span class="radio-led__core"></span></span>
    <span class="radio-led__label">Mid</span>
  </label>
  <label class="radio-led__option">
    <input class="radio-led__input" type="radio" name="radio-led" value="High">
    <span class="radio-led__lamp"><span class="radio-led__core"></span></span>
    <span class="radio-led__label">High</span>
  </label>
</div>
