<div class="radio-signal" role="radiogroup" aria-label="Band">
  <label class="radio-signal__option">
    <input class="radio-signal__input" type="radio" name="radio-signal" value="AM Band" checked>
    <span class="radio-signal__antenna">
      <span class="radio-signal__wave"></span>
      <span class="radio-signal__wave"></span>
      <span class="radio-signal__wave"></span>
      <span class="radio-signal__ring"><span class="radio-signal__dot"></span></span>
    </span>
    <span class="radio-signal__label">AM Band</span>
  </label>
  <label class="radio-signal__option">
    <input class="radio-signal__input" type="radio" name="radio-signal" value="FM Band">
    <span class="radio-signal__antenna">
      <span class="radio-signal__wave"></span>
      <span class="radio-signal__wave"></span>
      <span class="radio-signal__wave"></span>
      <span class="radio-signal__ring"><span class="radio-signal__dot"></span></span>
    </span>
    <span class="radio-signal__label">FM Band</span>
  </label>
  <label class="radio-signal__option">
    <input class="radio-signal__input" type="radio" name="radio-signal" value="Digital">
    <span class="radio-signal__antenna">
      <span class="radio-signal__wave"></span>
      <span class="radio-signal__wave"></span>
      <span class="radio-signal__wave"></span>
      <span class="radio-signal__ring"><span class="radio-signal__dot"></span></span>
    </span>
    <span class="radio-signal__label">Digital</span>
  </label>
</div>
