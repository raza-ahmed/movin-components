<div class="radio-rock-paper">
  <span class="radio-rock-paper__stage" aria-hidden="true">
    <span class="radio-rock-paper__hand">
      <span class="radio-rock-paper__fingers">
        <span class="radio-rock-paper__finger" style="left:18px;--i:0"></span>
        <span class="radio-rock-paper__finger" style="left:27px;--i:1"></span>
        <span class="radio-rock-paper__finger" style="left:36px;--i:2"></span>
        <span class="radio-rock-paper__finger" style="left:45px;--i:3"></span>
      </span>
      <span class="radio-rock-paper__wrist"></span>
      <span class="radio-rock-paper__palm"></span>
      <span class="radio-rock-paper__thumb"></span>
    </span>
  </span>
  <div class="radio-rock-paper__opts" role="radiogroup" aria-label="Your move">
    <label class="radio-rock-paper__opt"><input class="radio-rock-paper__input" type="radio" name="radio-rock-paper" checked="" value="rock"/>Rock</label>
    <label class="radio-rock-paper__opt"><input class="radio-rock-paper__input" type="radio" name="radio-rock-paper" value="paper"/>Paper</label>
    <label class="radio-rock-paper__opt"><input class="radio-rock-paper__input" type="radio" name="radio-rock-paper" value="scissors"/>Scissors</label>
  </div>
</div>
