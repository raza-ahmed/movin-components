<div class="radio-scan-line" role="radiogroup" aria-label="Signal">
  <label class="radio-scan-line__option">
    <input class="radio-scan-line__input" type="radio" name="radio-scan-line" value="SIGNAL_A" checked>
    <span class="radio-scan-line__sweep"></span>
    <span class="radio-scan-line__ring"><span class="radio-scan-line__dot"></span></span>
    <span class="radio-scan-line__label">SIGNAL_A</span>
  </label>
  <label class="radio-scan-line__option">
    <input class="radio-scan-line__input" type="radio" name="radio-scan-line" value="SIGNAL_B">
    <span class="radio-scan-line__sweep"></span>
    <span class="radio-scan-line__ring"><span class="radio-scan-line__dot"></span></span>
    <span class="radio-scan-line__label">SIGNAL_B</span>
  </label>
  <label class="radio-scan-line__option">
    <input class="radio-scan-line__input" type="radio" name="radio-scan-line" value="SIGNAL_C">
    <span class="radio-scan-line__sweep"></span>
    <span class="radio-scan-line__ring"><span class="radio-scan-line__dot"></span></span>
    <span class="radio-scan-line__label">SIGNAL_C</span>
  </label>
</div>
