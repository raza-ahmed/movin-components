<div class="radio-delivery">
  <div class="radio-delivery__road" aria-hidden="true">
    <span class="radio-delivery__truck"><svg viewBox="0 0 34 22"><path class="radio-delivery__body" d="M1 3.5h20v13H1zM21 7.5h6.5l4.5 5v4h-11z" /><path class="radio-delivery__window" d="M23 9.5h3.6l2.6 3H23z" /><g class="radio-delivery__wheel"><circle cx="7" cy="17.5" r="3" /><path d="M7 15.5v4" /></g><g class="radio-delivery__wheel"><circle cx="26" cy="17.5" r="3" /><path d="M26 15.5v4" /></g></svg></span>
    <span class="radio-delivery__mark">Today</span>
    <span class="radio-delivery__mark radio-delivery__mark--end">+7 days</span>
  </div>
  <div class="radio-delivery__list" role="radiogroup" aria-label="Delivery">
    <label class="radio-delivery__option">
      <input class="radio-delivery__input" type="radio" name="radio-delivery" value="standard" data-days="6" checked>
      <span class="radio-delivery__dot" aria-hidden="true"></span>
      <span class="radio-delivery__name">Standard</span>
      <span class="radio-delivery__eta">5–7 days</span>
      <span class="radio-delivery__price">Free</span>
    </label>
    <label class="radio-delivery__option">
      <input class="radio-delivery__input" type="radio" name="radio-delivery" value="express" data-days="2">
      <span class="radio-delivery__dot" aria-hidden="true"></span>
      <span class="radio-delivery__name">Express</span>
      <span class="radio-delivery__eta">2 days</span>
      <span class="radio-delivery__price">$9</span>
    </label>
    <label class="radio-delivery__option">
      <input class="radio-delivery__input" type="radio" name="radio-delivery" value="overnight" data-days="1">
      <span class="radio-delivery__dot" aria-hidden="true"></span>
      <span class="radio-delivery__name">Overnight</span>
      <span class="radio-delivery__eta">Tomorrow</span>
      <span class="radio-delivery__price">$19</span>
    </label>
  </div>
</div>
