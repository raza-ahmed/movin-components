<div class="radio-wind">
  <span class="radio-wind__field" aria-hidden="true">
    <span class="radio-wind__grass" style="left:56px;height:10px;--d:0.00s"></span>
    <span class="radio-wind__grass" style="left:70px;height:14px;--d:-0.09s"></span>
    <span class="radio-wind__grass" style="left:84px;height:18px;--d:-0.18s"></span>
    <span class="radio-wind__grass" style="left:98px;height:10px;--d:-0.27s"></span>
    <span class="radio-wind__grass" style="left:112px;height:14px;--d:-0.36s"></span>
    <span class="radio-wind__grass" style="left:126px;height:18px;--d:-0.45s"></span>
    <span class="radio-wind__grass" style="left:140px;height:10px;--d:-0.54s"></span>
    <span class="radio-wind__grass" style="left:154px;height:14px;--d:-0.63s"></span>
    <span class="radio-wind__pole"></span>
    <span class="radio-wind__mount">
      <span class="radio-wind__sock">
        <span class="radio-wind__band" style="--i:0"></span>
        <span class="radio-wind__band" style="--i:1"></span>
        <span class="radio-wind__band" style="--i:2"></span>
        <span class="radio-wind__band" style="--i:3"></span>
        <span class="radio-wind__band" style="--i:4"></span>
      </span>
    </span>
  </span>
  <div class="radio-wind__opts" role="radiogroup" aria-label="Wind">
    <label class="radio-wind__opt"><input class="radio-wind__input" type="radio" name="radio-wind" checked="" value="calm"/>Calm</label>
    <label class="radio-wind__opt"><input class="radio-wind__input" type="radio" name="radio-wind" value="breeze"/>Breeze</label>
    <label class="radio-wind__opt"><input class="radio-wind__input" type="radio" name="radio-wind" value="gale"/>Gale</label>
  </div>
</div>
