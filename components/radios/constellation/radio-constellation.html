<div class="radio-constellation" role="radiogroup" aria-label="Constellation">
  <label class="radio-constellation__option">
    <input class="radio-constellation__input" type="radio" name="radio-constellation" value="Orion" checked>
    <span class="radio-constellation__chart">
      <svg class="radio-constellation__lines" width="28" height="28" viewBox="0 0 28 28"><line x1="14" y1="2" x2="25" y2="8" /><line x1="25" y1="8" x2="21" y2="22" /><line x1="21" y1="22" x2="7" y2="22" /><line x1="7" y1="22" x2="3" y2="8" /><line x1="3" y1="8" x2="14" y2="2" /></svg>
      <span class="radio-constellation__star" style="left: 12px; top: 0px"></span><span class="radio-constellation__star" style="left: 23px; top: 6px"></span><span class="radio-constellation__star" style="left: 19px; top: 20px"></span><span class="radio-constellation__star" style="left: 5px; top: 20px"></span><span class="radio-constellation__star" style="left: 1px; top: 6px"></span>
      <span class="radio-constellation__ring"><span class="radio-constellation__dot"></span></span>
    </span>
    <span class="radio-constellation__label">Orion</span>
  </label>
  <label class="radio-constellation__option">
    <input class="radio-constellation__input" type="radio" name="radio-constellation" value="Cassiopeia">
    <span class="radio-constellation__chart">
      <svg class="radio-constellation__lines" width="28" height="28" viewBox="0 0 28 28"><line x1="14" y1="2" x2="25" y2="8" /><line x1="25" y1="8" x2="21" y2="22" /><line x1="21" y1="22" x2="7" y2="22" /><line x1="7" y1="22" x2="3" y2="8" /><line x1="3" y1="8" x2="14" y2="2" /></svg>
      <span class="radio-constellation__star" style="left: 12px; top: 0px"></span><span class="radio-constellation__star" style="left: 23px; top: 6px"></span><span class="radio-constellation__star" style="left: 19px; top: 20px"></span><span class="radio-constellation__star" style="left: 5px; top: 20px"></span><span class="radio-constellation__star" style="left: 1px; top: 6px"></span>
      <span class="radio-constellation__ring"><span class="radio-constellation__dot"></span></span>
    </span>
    <span class="radio-constellation__label">Cassiopeia</span>
  </label>
  <label class="radio-constellation__option">
    <input class="radio-constellation__input" type="radio" name="radio-constellation" value="Lyra">
    <span class="radio-constellation__chart">
      <svg class="radio-constellation__lines" width="28" height="28" viewBox="0 0 28 28"><line x1="14" y1="2" x2="25" y2="8" /><line x1="25" y1="8" x2="21" y2="22" /><line x1="21" y1="22" x2="7" y2="22" /><line x1="7" y1="22" x2="3" y2="8" /><line x1="3" y1="8" x2="14" y2="2" /></svg>
      <span class="radio-constellation__star" style="left: 12px; top: 0px"></span><span class="radio-constellation__star" style="left: 23px; top: 6px"></span><span class="radio-constellation__star" style="left: 19px; top: 20px"></span><span class="radio-constellation__star" style="left: 5px; top: 20px"></span><span class="radio-constellation__star" style="left: 1px; top: 6px"></span>
      <span class="radio-constellation__ring"><span class="radio-constellation__dot"></span></span>
    </span>
    <span class="radio-constellation__label">Lyra</span>
  </label>
</div>
