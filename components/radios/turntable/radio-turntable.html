<div class="radio-turntable">
  <div class="radio-turntable__deck" aria-hidden="true">
    <span class="radio-turntable__spin radio-turntable__spin--a"><span class="radio-turntable__spin radio-turntable__spin--b"><span class="radio-turntable__spin radio-turntable__spin--c"><span class="radio-turntable__record"></span></span></span></span>
    <span class="radio-turntable__arm"></span>
  </div>
  <div class="radio-turntable__row" role="radiogroup" aria-label="Speed">
    <label class="radio-turntable__option">
      <input class="radio-turntable__input" type="radio" name="radio-turntable" value="off">
      <span class="radio-turntable__chip">Off</span>
    </label>
    <label class="radio-turntable__option">
      <input class="radio-turntable__input" type="radio" name="radio-turntable" value="33" checked aria-label="33 rpm">
      <span class="radio-turntable__chip">33</span>
    </label>
    <label class="radio-turntable__option">
      <input class="radio-turntable__input" type="radio" name="radio-turntable" value="45" aria-label="45 rpm">
      <span class="radio-turntable__chip">45</span>
    </label>
    <label class="radio-turntable__option">
      <input class="radio-turntable__input" type="radio" name="radio-turntable" value="78" aria-label="78 rpm">
      <span class="radio-turntable__chip">78</span>
    </label>
  </div>
</div>
