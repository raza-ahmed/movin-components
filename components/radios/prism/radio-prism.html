<div class="radio-prism" role="radiogroup" aria-label="Shipping">
  <label class="radio-prism__option">
    <input class="radio-prism__input" type="radio" name="radio-prism" value="Standard" checked>
    <span class="radio-prism__gem"><span class="radio-prism__dot"></span></span>
    <span class="radio-prism__label">Standard</span>
  </label>
  <label class="radio-prism__option">
    <input class="radio-prism__input" type="radio" name="radio-prism" value="Express">
    <span class="radio-prism__gem"><span class="radio-prism__dot"></span></span>
    <span class="radio-prism__label">Express</span>
  </label>
  <label class="radio-prism__option">
    <input class="radio-prism__input" type="radio" name="radio-prism" value="Overnight">
    <span class="radio-prism__gem"><span class="radio-prism__dot"></span></span>
    <span class="radio-prism__label">Overnight</span>
  </label>
</div>
