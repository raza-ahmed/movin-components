<div class="radio-theme">
  <div class="radio-theme__panel">
    <span class="radio-theme__layer radio-theme__layer--light" aria-hidden="true"><span class="radio-theme__bar"></span><span class="radio-theme__avatar"></span><span class="radio-theme__line"></span><span class="radio-theme__line radio-theme__line--short"></span></span>
    <span class="radio-theme__layer radio-theme__layer--dim" aria-hidden="true"><span class="radio-theme__bar"></span><span class="radio-theme__avatar"></span><span class="radio-theme__line"></span><span class="radio-theme__line radio-theme__line--short"></span></span>
    <span class="radio-theme__layer radio-theme__layer--dark" aria-hidden="true"><span class="radio-theme__bar"></span><span class="radio-theme__avatar"></span><span class="radio-theme__line"></span><span class="radio-theme__line radio-theme__line--short"></span></span>
    <div class="radio-theme__chips" role="radiogroup" aria-label="Theme">
    <label class="radio-theme__option radio-theme__option--light">
      <input class="radio-theme__input" type="radio" name="radio-theme" value="light">
      <span class="radio-theme__chip">Light</span>
    </label>
    <label class="radio-theme__option radio-theme__option--dim">
      <input class="radio-theme__input" type="radio" name="radio-theme" value="dim">
      <span class="radio-theme__chip">Dim</span>
    </label>
    <label class="radio-theme__option radio-theme__option--dark">
      <input class="radio-theme__input" type="radio" name="radio-theme" value="dark" checked>
      <span class="radio-theme__chip">Dark</span>
    </label>
    </div>
  </div>
</div>
