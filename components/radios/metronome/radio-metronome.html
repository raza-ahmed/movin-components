<div class="radio-metronome">
  <span class="radio-metronome__body" aria-hidden="true">
    <span class="radio-metronome__case"></span>
    <span class="radio-metronome__face"></span>
    <span class="radio-metronome__beat"></span>
    <span class="radio-metronome__arm">
      <span class="radio-metronome__weight"></span>
    </span>
  </span>
  <div class="radio-metronome__side">
    <span class="radio-metronome__bpm" aria-hidden="true">
      <span class="radio-metronome__bpm-strip">
        <span>60 <small>BPM</small></span>
        <span>96 <small>BPM</small></span>
        <span>168 <small>BPM</small></span>
      </span>
    </span>
    <div class="radio-metronome__opts" role="radiogroup" aria-label="Tempo">
      <label class="radio-metronome__opt"><input class="radio-metronome__input" type="radio" name="radio-metronome" checked="" value="largo"/>Largo</label>
      <label class="radio-metronome__opt"><input class="radio-metronome__input" type="radio" name="radio-metronome" value="andante"/>Andante</label>
      <label class="radio-metronome__opt"><input class="radio-metronome__input" type="radio" name="radio-metronome" value="presto"/>Presto</label>
    </div>
  </div>
</div>
