<div class="radio-die">
  <div class="radio-die__stage" aria-hidden="true">
    <div class="radio-die__toss">
      <div class="radio-die__cube">
      <span class="radio-die__face radio-die__face--1"></span>
      <span class="radio-die__face radio-die__face--2"></span>
      <span class="radio-die__face radio-die__face--3"></span>
      <span class="radio-die__face radio-die__face--4"></span>
      <span class="radio-die__face radio-die__face--5"></span>
      <span class="radio-die__face radio-die__face--6"></span>
      </div>
    </div>
    <span class="radio-die__shadow"></span>
  </div>
  <div class="radio-die__row" role="radiogroup" aria-label="Roll">
    <label class="radio-die__option">
      <input class="radio-die__input" type="radio" name="radio-die" value="1" checked>
      <span class="radio-die__chip">1</span>
    </label>
    <label class="radio-die__option">
      <input class="radio-die__input" type="radio" name="radio-die" value="2">
      <span class="radio-die__chip">2</span>
    </label>
    <label class="radio-die__option">
      <input class="radio-die__input" type="radio" name="radio-die" value="3">
      <span class="radio-die__chip">3</span>
    </label>
    <label class="radio-die__option">
      <input class="radio-die__input" type="radio" name="radio-die" value="4">
      <span class="radio-die__chip">4</span>
    </label>
    <label class="radio-die__option">
      <input class="radio-die__input" type="radio" name="radio-die" value="5">
      <span class="radio-die__chip">5</span>
    </label>
    <label class="radio-die__option">
      <input class="radio-die__input" type="radio" name="radio-die" value="6">
      <span class="radio-die__chip">6</span>
    </label>
  </div>
</div>
