<div class="radio-burner">
  <span class="radio-burner__stove" aria-hidden="true">
    <span class="radio-burner__ring">
      <span class="radio-burner__glow"></span>
      <span class="radio-burner__flames">
        <span class="radio-burner__flame" style="--i:0"></span>
        <span class="radio-burner__flame" style="--i:1"></span>
        <span class="radio-burner__flame" style="--i:2"></span>
        <span class="radio-burner__flame" style="--i:3"></span>
        <span class="radio-burner__flame" style="--i:4"></span>
        <span class="radio-burner__flame" style="--i:5"></span>
        <span class="radio-burner__flame" style="--i:6"></span>
        <span class="radio-burner__flame" style="--i:7"></span>
        <span class="radio-burner__flame" style="--i:8"></span>
      </span>
      <span class="radio-burner__base"></span>
    </span>
    <span class="radio-burner__knob"></span>
  </span>
  <div class="radio-burner__opts" role="radiogroup" aria-label="Flame">
    <label class="radio-burner__opt"><input class="radio-burner__input" type="radio" name="radio-burner" checked="" value="low"/>Low</label>
    <label class="radio-burner__opt"><input class="radio-burner__input" type="radio" name="radio-burner" value="medium"/>Medium</label>
    <label class="radio-burner__opt"><input class="radio-burner__input" type="radio" name="radio-burner" value="high"/>High</label>
  </div>
</div>
