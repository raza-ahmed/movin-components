<div class="radio-gear">
  <span class="radio-gear__display" aria-hidden="true">
    <span class="radio-gear__strip">
      <span>P</span>
      <span>R</span>
      <span>N</span>
      <span>D</span>
    </span>
  </span>
  <div class="radio-gear__gate">
    <span class="radio-gear__slot" aria-hidden="true"></span>
    <span class="radio-gear__knob" aria-hidden="true"></span>
    <div class="radio-gear__letters" role="radiogroup" aria-label="Gear">
      <label class="radio-gear__letter">
        <input class="radio-gear__input" type="radio" aria-label="Park" name="radio-gear" checked="" value="p"/>
        <span aria-hidden="true">P</span>
      </label>
      <label class="radio-gear__letter">
        <input class="radio-gear__input" type="radio" aria-label="Reverse" name="radio-gear" value="r"/>
        <span aria-hidden="true">R</span>
      </label>
      <label class="radio-gear__letter">
        <input class="radio-gear__input" type="radio" aria-label="Neutral" name="radio-gear" value="n"/>
        <span aria-hidden="true">N</span>
      </label>
      <label class="radio-gear__letter">
        <input class="radio-gear__input" type="radio" aria-label="Drive" name="radio-gear" value="d"/>
        <span aria-hidden="true">D</span>
      </label>
    </div>
  </div>
</div>
