<div class="radio-stamp" role="radiogroup" aria-label="Status">
  <label class="radio-stamp__option">
    <input class="radio-stamp__input" type="radio" name="radio-stamp" value="Draft">
    <span class="radio-stamp__ring"><span class="radio-stamp__dot"></span></span>
    <span class="radio-stamp__label">Draft</span>
  </label>
  <label class="radio-stamp__option">
    <input class="radio-stamp__input" type="radio" name="radio-stamp" value="Approved">
    <span class="radio-stamp__ring"><span class="radio-stamp__dot"></span></span>
    <span class="radio-stamp__label">Approved</span>
  </label>
  <label class="radio-stamp__option">
    <input class="radio-stamp__input" type="radio" name="radio-stamp" value="Rejected">
    <span class="radio-stamp__ring"><span class="radio-stamp__dot"></span></span>
    <span class="radio-stamp__label">Rejected</span>
  </label>
</div>
