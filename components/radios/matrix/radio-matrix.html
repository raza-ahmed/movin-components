<div class="radio-matrix" role="radiogroup" aria-label="Command">
  <label class="radio-matrix__option">
    <input class="radio-matrix__input" type="radio" name="radio-matrix" value="INIT" checked>
    <span class="radio-matrix__cursor"></span>
    <span class="radio-matrix__label">INIT</span>
  </label>
  <label class="radio-matrix__option">
    <input class="radio-matrix__input" type="radio" name="radio-matrix" value="EXEC">
    <span class="radio-matrix__cursor"></span>
    <span class="radio-matrix__label">EXEC</span>
  </label>
  <label class="radio-matrix__option">
    <input class="radio-matrix__input" type="radio" name="radio-matrix" value="HALT">
    <span class="radio-matrix__cursor"></span>
    <span class="radio-matrix__label">HALT</span>
  </label>
</div>
