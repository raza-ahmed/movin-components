<div class="radio-wheel" style="--radio-wheel-r:-45deg">
  <span class="radio-wheel__stage" aria-hidden="true">
    <span class="radio-wheel__pointer"></span>
    <span class="radio-wheel__disc">
      <span class="radio-wheel__label" style="--a:45deg">Pizza</span>
      <span class="radio-wheel__label" style="--a:135deg">Sushi</span>
      <span class="radio-wheel__label" style="--a:225deg">Tacos</span>
      <span class="radio-wheel__label" style="--a:315deg">Curry</span>
      <span class="radio-wheel__hub"></span>
    </span>
  </span>
  <div class="radio-wheel__opts" role="radiogroup" aria-label="Dinner">
    <label class="radio-wheel__opt"><input class="radio-wheel__input" type="radio" name="radio-wheel" checked="" value="pizza"/>Pizza</label>
    <label class="radio-wheel__opt"><input class="radio-wheel__input" type="radio" name="radio-wheel" value="sushi"/>Sushi</label>
    <label class="radio-wheel__opt"><input class="radio-wheel__input" type="radio" name="radio-wheel" value="tacos"/>Tacos</label>
    <label class="radio-wheel__opt"><input class="radio-wheel__input" type="radio" name="radio-wheel" value="curry"/>Curry</label>
  </div>
</div>
