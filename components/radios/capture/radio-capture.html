<div class="radio-capture">
  <div class="radio-capture__finder" aria-hidden="true">
    <span class="radio-capture__bg"></span>
    <span class="radio-capture__subject"></span>
    <span class="radio-capture__tag radio-capture__tag--v"><i></i>REC 00:12</span>
    <span class="radio-capture__tag radio-capture__tag--p">f/1.8</span>
    <span class="radio-capture__shutter">
      <span class="radio-capture__core"></span>
    </span>
  </div>
  <div class="radio-capture__opts" role="radiogroup" aria-label="Camera mode">
    <label class="radio-capture__opt"><input class="radio-capture__input" type="radio" name="radio-capture" checked="" value="photo"/>Photo</label>
    <label class="radio-capture__opt"><input class="radio-capture__input" type="radio" name="radio-capture" value="video"/>Video</label>
    <label class="radio-capture__opt"><input class="radio-capture__input" type="radio" name="radio-capture" value="portrait"/>Portrait</label>
  </div>
</div>
