<div class="radio-fps">
  <svg class="radio-fps__stage" viewBox="0 0 220 92" aria-hidden="true">
    <line class="radio-fps__ground" x1="14" y1="84" x2="206" y2="84"></line>
    <circle class="radio-fps__ghost" cx="24" cy="76" r="7" opacity="0.45"></circle>
    <circle class="radio-fps__ghost" cx="24" cy="76" r="7" opacity="0.25"></circle>
    <circle class="radio-fps__ghost" cx="24" cy="76" r="7" opacity="0.12"></circle>
    <circle class="radio-fps__ball" cx="24" cy="76" r="7"></circle>
  </svg>
  <span class="radio-fps__read" aria-live="polite">12 frames a second. Steppy, like stop motion.</span>
  <div class="radio-fps__opts" role="radiogroup" aria-label="Frame rate">
    <label class="radio-fps__opt">
      <input class="radio-fps__input" type="radio" name="radio-fps" checked="" value="12"/>
      12 fps
    </label>
    <label class="radio-fps__opt">
      <input class="radio-fps__input" type="radio" name="radio-fps" value="24"/>
      24 fps
    </label>
    <label class="radio-fps__opt">
      <input class="radio-fps__input" type="radio" name="radio-fps" value="60"/>
      60 fps
    </label>
  </div>
</div>
