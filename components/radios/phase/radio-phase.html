<div class="radio-phase">
  <span class="radio-phase__sky" aria-hidden="true">
    <span class="radio-phase__star" style="left:12px;top:14px;--d:0s"></span>
    <span class="radio-phase__star" style="left:30px;top:70px;--d:0.8s"></span>
    <span class="radio-phase__star" style="left:150px;top:18px;--d:1.4s"></span>
    <span class="radio-phase__star" style="left:166px;top:64px;--d:0.4s"></span>
    <span class="radio-phase__star" style="left:24px;top:44px;--d:1.9s"></span>
    <span class="radio-phase__star" style="left:140px;top:84px;--d:1.1s"></span>
    <span class="radio-phase__halo"></span>
    <span class="radio-phase__moon">
      <span class="radio-phase__crater" style="left:16px;top:20px;width:10px;height:10px"></span>
      <span class="radio-phase__crater" style="left:40px;top:36px;width:14px;height:14px"></span>
      <span class="radio-phase__crater" style="left:24px;top:46px;width:7px;height:7px"></span>
      <span class="radio-phase__crater" style="left:46px;top:14px;width:6px;height:6px"></span>
      <span class="radio-phase__shadow"></span>
    </span>
  </span>
  <div class="radio-phase__opts" role="radiogroup" aria-label="Moon phase">
    <label class="radio-phase__opt"><input class="radio-phase__input" type="radio" name="radio-phase" value="new"/>New</label>
    <label class="radio-phase__opt"><input class="radio-phase__input" type="radio" name="radio-phase" checked="" value="crescent"/>Crescent</label>
    <label class="radio-phase__opt"><input class="radio-phase__input" type="radio" name="radio-phase" value="gibbous"/>Gibbous</label>
    <label class="radio-phase__opt"><input class="radio-phase__input" type="radio" name="radio-phase" value="full"/>Full</label>
  </div>
</div>
