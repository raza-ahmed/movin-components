<div class="radio-xp-bar" role="radiogroup" aria-label="Tier">
  <label class="radio-xp-bar__option">
    <input class="radio-xp-bar__input" type="radio" name="radio-xp-bar" value="Novice">
    <span class="radio-xp-bar__head">
      <span class="radio-xp-bar__name">Novice</span>
      <span class="radio-xp-bar__xp">XP +50</span>
    </span>
    <span class="radio-xp-bar__track">
      <span class="radio-xp-bar__fill"></span>
      <span class="radio-xp-bar__spark" style="--radio-xp-bar-x: 0px; --radio-xp-bar-y: -10px"></span><span class="radio-xp-bar__spark" style="--radio-xp-bar-x: 6px; --radio-xp-bar-y: -8px"></span><span class="radio-xp-bar__spark" style="--radio-xp-bar-x: -6px; --radio-xp-bar-y: -8px"></span><span class="radio-xp-bar__spark" style="--radio-xp-bar-x: 8px; --radio-xp-bar-y: -4px"></span>
    </span>
  </label>
  <label class="radio-xp-bar__option">
    <input class="radio-xp-bar__input" type="radio" name="radio-xp-bar" value="Adept">
    <span class="radio-xp-bar__head">
      <span class="radio-xp-bar__name">Adept</span>
      <span class="radio-xp-bar__xp">XP +150</span>
    </span>
    <span class="radio-xp-bar__track">
      <span class="radio-xp-bar__fill"></span>
      <span class="radio-xp-bar__spark" style="--radio-xp-bar-x: 0px; --radio-xp-bar-y: -10px"></span><span class="radio-xp-bar__spark" style="--radio-xp-bar-x: 6px; --radio-xp-bar-y: -8px"></span><span class="radio-xp-bar__spark" style="--radio-xp-bar-x: -6px; --radio-xp-bar-y: -8px"></span><span class="radio-xp-bar__spark" style="--radio-xp-bar-x: 8px; --radio-xp-bar-y: -4px"></span>
    </span>
  </label>
  <label class="radio-xp-bar__option">
    <input class="radio-xp-bar__input" type="radio" name="radio-xp-bar" value="Master">
    <span class="radio-xp-bar__head">
      <span class="radio-xp-bar__name">Master</span>
      <span class="radio-xp-bar__xp">XP +500</span>
    </span>
    <span class="radio-xp-bar__track">
      <span class="radio-xp-bar__fill"></span>
      <span class="radio-xp-bar__spark" style="--radio-xp-bar-x: 0px; --radio-xp-bar-y: -10px"></span><span class="radio-xp-bar__spark" style="--radio-xp-bar-x: 6px; --radio-xp-bar-y: -8px"></span><span class="radio-xp-bar__spark" style="--radio-xp-bar-x: -6px; --radio-xp-bar-y: -8px"></span><span class="radio-xp-bar__spark" style="--radio-xp-bar-x: 8px; --radio-xp-bar-y: -4px"></span>
    </span>
  </label>
</div>
