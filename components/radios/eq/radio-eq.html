<div class="radio-eq">
  <div class="radio-eq__graph" aria-hidden="true">
    <svg viewBox="0 0 220 80">
      <line class="radio-eq__grid" x1="0" y1="0" x2="0" y2="80"></line>
      <line class="radio-eq__grid" x1="55" y1="0" x2="55" y2="80"></line>
      <line class="radio-eq__grid" x1="110" y1="0" x2="110" y2="80"></line>
      <line class="radio-eq__grid" x1="165" y1="0" x2="165" y2="80"></line>

      <line class="radio-eq__mid" x1="0" y1="40" x2="220" y2="40"></line>
