<div class="radio-drum">
  <span class="radio-drum__title" aria-hidden="true">Remind me in</span>
  <div class="radio-drum__window" role="radiogroup" aria-label="Remind me in">
    <span class="radio-drum__band" aria-hidden="true"></span>
    <div class="radio-drum__wheel">
      <label class="radio-drum__option" style="--radio-drum-i: 0">
        <input class="radio-drum__input" type="radio" name="radio-drum" value="15 min">
        <span class="radio-drum__text">15 min</span>
      </label>
      <label class="radio-drum__option" style="--radio-drum-i: 1">
        <input class="radio-drum__input" type="radio" name="radio-drum" value="30 min">
        <span class="radio-drum__text">30 min</span>
      </label>
      <label class="radio-drum__option" style="--radio-drum-i: 2">
        <input class="radio-drum__input" type="radio" name="radio-drum" value="45 min">
        <span class="radio-drum__text">45 min</span>
      </label>
      <label class="radio-drum__option" style="--radio-drum-i: 3">
        <input class="radio-drum__input" type="radio" name="radio-drum" value="1 hour" checked>
        <span class="radio-drum__text">1 hour</span>
      </label>
      <label class="radio-drum__option" style="--radio-drum-i: 4">
        <input class="radio-drum__input" type="radio" name="radio-drum" value="2 hours">
        <span class="radio-drum__text">2 hours</span>
      </label>
      <label class="radio-drum__option" style="--radio-drum-i: 5">
        <input class="radio-drum__input" type="radio" name="radio-drum" value="4 hours">
        <span class="radio-drum__text">4 hours</span>
      </label>
      <label class="radio-drum__option" style="--radio-drum-i: 6">
        <input class="radio-drum__input" type="radio" name="radio-drum" value="Tomorrow">
        <span class="radio-drum__text">Tomorrow</span>
      </label>
    </div>
  </div>
</div>
