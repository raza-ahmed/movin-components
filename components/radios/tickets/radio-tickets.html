<div class="radio-tickets">
  <span class="radio-tickets__fan" aria-hidden="true">
    <span class="radio-tickets__ticket" style="--i:3"></span>
    <span class="radio-tickets__ticket" style="--i:2"></span>
    <span class="radio-tickets__ticket" style="--i:1"></span>
    <span class="radio-tickets__ticket" style="--i:0"></span>
  </span>
  <div class="radio-tickets__opts" role="radiogroup" aria-label="Tickets">
    <label class="radio-tickets__opt">
      <input class="radio-tickets__input" type="radio" aria-label="1 ticket" name="radio-tickets" value="1"/>
      <span aria-hidden="true">1</span>
    </label>
    <label class="radio-tickets__opt">
      <input class="radio-tickets__input" type="radio" aria-label="2 tickets" name="radio-tickets" checked="" value="2"/>
      <span aria-hidden="true">2</span>
    </label>
    <label class="radio-tickets__opt">
      <input class="radio-tickets__input" type="radio" aria-label="3 tickets" name="radio-tickets" value="3"/>
      <span aria-hidden="true">3</span>
    </label>
    <label class="radio-tickets__opt">
      <input class="radio-tickets__input" type="radio" aria-label="4 tickets" name="radio-tickets" value="4"/>
      <span aria-hidden="true">4</span>
    </label>
  </div>
</div>
