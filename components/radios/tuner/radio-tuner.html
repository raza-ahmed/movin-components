<div class="radio-tuner">
  <span class="radio-tuner__dial" aria-hidden="true">
    <span class="radio-tuner__ticks"></span>
    <span class="radio-tuner__nums">
      <span style="left:10px">88</span>
      <span style="left:50px">92</span>
      <span style="left:90px">96</span>
      <span style="left:130px">100</span>
      <span style="left:170px">104</span>
      <span style="left:210px">108</span>
    </span>
    <span class="radio-tuner__band">FM</span>
    <span class="radio-tuner__lamp">STEREO</span>
    <span class="radio-tuner__needle"></span>
  </span>
  <div class="radio-tuner__opts" role="radiogroup" aria-label="Station">
    <label class="radio-tuner__opt">
      <input class="radio-tuner__input" type="radio" name="radio-tuner" checked="" value="jazz"/>
      <span class="radio-tuner__name">Jazz</span>
      <span class="radio-tuner__freq">89.5</span>
    </label>
    <label class="radio-tuner__opt">
      <input class="radio-tuner__input" type="radio" name="radio-tuner" value="news"/>
      <span class="radio-tuner__name">News</span>
      <span class="radio-tuner__freq">97.3</span>
    </label>
    <label class="radio-tuner__opt">
      <input class="radio-tuner__input" type="radio" name="radio-tuner" value="lofi"/>
      <span class="radio-tuner__name">Lo-fi</span>
      <span class="radio-tuner__freq">104.1</span>
    </label>
  </div>
</div>
