<div class="radio-elevation">
  <div class="radio-elevation__stage" aria-hidden="true">
    <div class="radio-elevation__card">
      <span class="radio-elevation__line"></span>
      <span class="radio-elevation__line"></span>
      <span class="radio-elevation__line" style="width:80%"></span>
    </div>
  </div>
  <span class="radio-elevation__read" aria-hidden="true">
    <span>0 dp, sits on the page</span>
    <span>4 dp, for cards and tiles</span>
    <span>12 dp, for menus and dialogs</span>
  </span>
  <div class="radio-elevation__opts" role="radiogroup" aria-label="Elevation">
    <label class="radio-elevation__opt">
      <input class="radio-elevation__input" type="radio" name="radio-elevation" value="flat"/>
      Flat
    </label>
    <label class="radio-elevation__opt">
      <input class="radio-elevation__input" type="radio" name="radio-elevation" checked="" value="raised"/>
      Raised
    </label>
    <label class="radio-elevation__opt">
      <input class="radio-elevation__input" type="radio" name="radio-elevation" value="floating"/>
      Floating
    </label>
  </div>
</div>
