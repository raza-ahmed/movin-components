<div class="radio-recline">
  <span class="radio-recline__seat" aria-hidden="true">
    <span class="radio-recline__floor"></span>
    <span class="radio-recline__foot"></span>
    <span class="radio-recline__post"></span>
    <span class="radio-recline__back"></span>
    <span class="radio-recline__leg"></span>
    <span class="radio-recline__cushion"></span>
    <span class="radio-recline__arm"></span>
  </span>
  <div class="radio-recline__opts" role="radiogroup" aria-label="Cabin">
    <label class="radio-recline__opt"><input class="radio-recline__input" type="radio" name="radio-recline" checked="" value="economy"/>Economy</label>
    <label class="radio-recline__opt"><input class="radio-recline__input" type="radio" name="radio-recline" value="premium"/>Premium</label>
    <label class="radio-recline__opt"><input class="radio-recline__input" type="radio" name="radio-recline" value="business"/>Business</label>
  </div>
</div>
