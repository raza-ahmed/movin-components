<div class="radio-egg">
  <div class="radio-egg__plate" aria-hidden="true">
    <svg viewBox="0 0 200 112">
      <ellipse class="radio-egg__dish" cx="100" cy="70" rx="92" ry="38"></ellipse>
      <path class="radio-egg__white" d="M100 22C134 22 156 40 156 60C156 82 130 96 100 96C70 96 44 82 44 60C44 40 66 22 100 22Z"></path>
      <path class="radio-egg__drip" d="M95 74C96 84 102 90 108 96C111 99 113 104 116 105C120 106 121 101 118 97C113 90 110 82 109 74Z"></path>
      <circle class="radio-egg__yolk" cx="100" cy="60" r="21"></circle>
      <circle class="radio-egg__core" cx="100" cy="60" r="21"></circle>
      <ellipse class="radio-egg__gloss" cx="93" cy="53" rx="6" ry="4"></ellipse>
    </svg>
  </div>
  <span class="radio-egg__read" aria-hidden="true">
    <span>6 min, runny yolk</span>
    <span>8 min, set at the edge</span>
    <span>10 min, firm all through</span>
  </span>
  <div class="radio-egg__opts" role="radiogroup" aria-label="Boiled egg">
    <label class="radio-egg__opt">
      <input class="radio-egg__input" type="radio" name="radio-egg" checked="" value="soft"/>
      Soft
    </label>
    <label class="radio-egg__opt">
      <input class="radio-egg__input" type="radio" name="radio-egg" value="jammy"/>
      Jammy
    </label>
    <label class="radio-egg__opt">
      <input class="radio-egg__input" type="radio" name="radio-egg" value="hard"/>
      Hard
    </label>
  </div>
</div>
