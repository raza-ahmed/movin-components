<div class="radio-seat">
  <span class="radio-seat__screen" aria-hidden="true">Screen</span>
  <div class="radio-seat__grid" role="radiogroup" aria-label="Seat">
    <label class="radio-seat__option">
      <input class="radio-seat__input" type="radio" name="radio-seat" value="A1" aria-label="Row A, seat 1">
      <span class="radio-seat__seat" aria-hidden="true"></span>
    </label>
    <label class="radio-seat__option">
      <input class="radio-seat__input" type="radio" name="radio-seat" value="A2" aria-label="Row A, seat 2">
      <span class="radio-seat__seat" aria-hidden="true"></span>
    </label>
    <label class="radio-seat__option">
      <input class="radio-seat__input" type="radio" name="radio-seat" value="A3" aria-label="Row A, seat 3">
      <span class="radio-seat__seat" aria-hidden="true"></span>
    </label>
    <label class="radio-seat__option">
      <input class="radio-seat__input" type="radio" name="radio-seat" value="A4" aria-label="Row A, seat 4, taken" disabled>
      <span class="radio-seat__seat" aria-hidden="true"></span>
    </label>
    <label class="radio-seat__option">
      <input class="radio-seat__input" type="radio" name="radio-seat" value="B1" aria-label="Row B, seat 1">
      <span class="radio-seat__seat" aria-hidden="true"></span>
    </label>
    <label class="radio-seat__option">
      <input class="radio-seat__input" type="radio" name="radio-seat" value="B2" aria-label="Row B, seat 2, taken" disabled>
      <span class="radio-seat__seat" aria-hidden="true"></span>
    </label>
    <label class="radio-seat__option">
      <input class="radio-seat__input" type="radio" name="radio-seat" value="B3" aria-label="Row B, seat 3">
      <span class="radio-seat__seat" aria-hidden="true"></span>
    </label>
    <label class="radio-seat__option">
      <input class="radio-seat__input" type="radio" name="radio-seat" value="B4" aria-label="Row B, seat 4">
      <span class="radio-seat__seat" aria-hidden="true"></span>
    </label>
    <label class="radio-seat__option">
      <input class="radio-seat__input" type="radio" name="radio-seat" value="C1" aria-label="Row C, seat 1, taken" disabled>
      <span class="radio-seat__seat" aria-hidden="true"></span>
    </label>
    <label class="radio-seat__option">
      <input class="radio-seat__input" type="radio" name="radio-seat" value="C2" aria-label="Row C, seat 2">
      <span class="radio-seat__seat" aria-hidden="true"></span>
    </label>
    <label class="radio-seat__option">
      <input class="radio-seat__input" type="radio" name="radio-seat" value="C3" aria-label="Row C, seat 3">
      <span class="radio-seat__seat" aria-hidden="true"></span>
    </label>
    <label class="radio-seat__option">
      <input class="radio-seat__input" type="radio" name="radio-seat" value="C4" aria-label="Row C, seat 4">
      <span class="radio-seat__seat" aria-hidden="true"></span>
    </label>
  </div>
  <div class="radio-seat__ticket" aria-hidden="true">
    <span class="radio-seat__ticket-label">Seat</span>
    <span class="radio-seat__code"><span>–</span></span>
  </div>
</div>
