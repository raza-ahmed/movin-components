<div class="radio-tone">
  <span class="radio-tone__bubble" aria-hidden="true">
    <span class="radio-tone__line radio-tone__line--formal">Dear team, please review.</span>
    <span class="radio-tone__line radio-tone__line--casual">Hey all, got a sec to look?</span>
    <span class="radio-tone__line radio-tone__line--playful">Yo crew, peep this!</span>
  </span>
  <div class="radio-tone__opts" role="radiogroup" aria-label="Tone">
    <label class="radio-tone__opt"><input class="radio-tone__input" type="radio" name="radio-tone" value="formal"/>Formal</label>
    <label class="radio-tone__opt"><input class="radio-tone__input" type="radio" name="radio-tone" checked="" value="casual"/>Casual</label>
    <label class="radio-tone__opt"><input class="radio-tone__input" type="radio" name="radio-tone" value="playful"/>Playful</label>
  </div>
</div>
