<div class="radio-hologram" role="radiogroup" aria-label="Projection">
  <label class="radio-hologram__option">
    <input class="radio-hologram__input" type="radio" name="radio-hologram" value="Projection A" checked>
    <span class="radio-hologram__scan"></span>
    <span class="radio-hologram__ring"><span class="radio-hologram__dot"></span></span>
    <span class="radio-hologram__label">Projection A</span>
  </label>
  <label class="radio-hologram__option">
    <input class="radio-hologram__input" type="radio" name="radio-hologram" value="Projection B">
    <span class="radio-hologram__scan"></span>
    <span class="radio-hologram__ring"><span class="radio-hologram__dot"></span></span>
    <span class="radio-hologram__label">Projection B</span>
  </label>
  <label class="radio-hologram__option">
    <input class="radio-hologram__input" type="radio" name="radio-hologram" value="Projection C">
    <span class="radio-hologram__scan"></span>
    <span class="radio-hologram__ring"><span class="radio-hologram__dot"></span></span>
    <span class="radio-hologram__label">Projection C</span>
  </label>
</div>
