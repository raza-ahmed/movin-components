<div class="radio-chess">
  <span class="radio-chess__board" aria-hidden="true">
    <span class="radio-chess__square"></span>
    <span class="radio-chess__square radio-chess__square--target">
      <span class="radio-chess__piece radio-chess__piece--queen">♛︎</span>
      <span class="radio-chess__piece radio-chess__piece--rook">♜︎</span>
      <span class="radio-chess__piece radio-chess__piece--bishop">♝︎</span>
      <span class="radio-chess__piece radio-chess__piece--knight">♞︎</span>
    </span>
    <span class="radio-chess__square"></span>
    <span class="radio-chess__square"></span>
    <span class="radio-chess__square"></span>
    <span class="radio-chess__square"></span>
  </span>
  <div class="radio-chess__opts" role="radiogroup" aria-label="Promote to">
    <label class="radio-chess__opt">
      <input class="radio-chess__input" type="radio" aria-label="Queen" name="radio-chess" checked="" value="queen"/>
      <span aria-hidden="true">♛︎</span>
    </label>
    <label class="radio-chess__opt">
      <input class="radio-chess__input" type="radio" aria-label="Rook" name="radio-chess" value="rook"/>
      <span aria-hidden="true">♜︎</span>
    </label>
    <label class="radio-chess__opt">
      <input class="radio-chess__input" type="radio" aria-label="Bishop" name="radio-chess" value="bishop"/>
      <span aria-hidden="true">♝︎</span>
    </label>
    <label class="radio-chess__opt">
      <input class="radio-chess__input" type="radio" aria-label="Knight" name="radio-chess" value="knight"/>
      <span aria-hidden="true">♞︎</span>
    </label>
  </div>
</div>
