<div class="radio-hop" style="--radio-hop-k:1;--radio-hop-n:1">
  <span class="radio-hop__lane" aria-hidden="true">
    <span class="radio-hop__x">
      <span class="radio-hop__ball"></span>
    </span>
  </span>
  <div class="radio-hop__tiles" role="radiogroup" aria-label="Size">
    <label class="radio-hop__tile"><input class="radio-hop__input" type="radio" name="radio-hop" value="S"/>S</label>
    <label class="radio-hop__tile"><input class="radio-hop__input" type="radio" name="radio-hop" checked="" value="M"/>M</label>
    <label class="radio-hop__tile"><input class="radio-hop__input" type="radio" name="radio-hop" value="L"/>L</label>
    <label class="radio-hop__tile"><input class="radio-hop__input" type="radio" name="radio-hop" value="XL"/>XL</label>
  </div>
</div>
