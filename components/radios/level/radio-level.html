<div class="radio-level">
  <span class="radio-level__body" aria-hidden="true">
    <span class="radio-level__vial">
      <span class="radio-level__mark" style="left:28px"></span>
      <span class="radio-level__mark" style="right:28px"></span>
      <span class="radio-level__bubble"></span>
    </span>
  </span>
  <div class="radio-level__opts" role="radiogroup" aria-label="Balance">
    <label class="radio-level__opt"><input class="radio-level__input" type="radio" name="radio-level" value="left"/>Left</label>
    <label class="radio-level__opt"><input class="radio-level__input" type="radio" name="radio-level" checked="" value="centre"/>Centre</label>
    <label class="radio-level__opt"><input class="radio-level__input" type="radio" name="radio-level" value="right"/>Right</label>
  </div>
</div>
