<div class="radio-layers">
  <span class="radio-layers__stack" aria-hidden="true">
    <span class="radio-layers__sheet radio-layers__sheet--map"></span>
    <span class="radio-layers__sheet radio-layers__sheet--satellite"></span>
    <span class="radio-layers__sheet radio-layers__sheet--terrain"></span>
  </span>
  <div class="radio-layers__opts" role="radiogroup" aria-label="Map layer">
    <label class="radio-layers__opt"><input class="radio-layers__input" type="radio" name="radio-layers" checked="" value="map"/>Map</label>
    <label class="radio-layers__opt"><input class="radio-layers__input" type="radio" name="radio-layers" value="satellite"/>Satellite</label>
    <label class="radio-layers__opt"><input class="radio-layers__input" type="radio" name="radio-layers" value="terrain"/>Terrain</label>
  </div>
</div>
