<div class="radio-layout">
  <div class="radio-layout__preview" aria-hidden="true">
    <span class="radio-layout__tile" style="--radio-layout-i: 0"></span>
    <span class="radio-layout__tile" style="--radio-layout-i: 1"></span>
    <span class="radio-layout__tile" style="--radio-layout-i: 2"></span>
    <span class="radio-layout__tile" style="--radio-layout-i: 3"></span>
  </div>
  <div class="radio-layout__row" role="radiogroup" aria-label="Layout">
    <label class="radio-layout__option">
      <input class="radio-layout__input" type="radio" name="radio-layout" value="grid" aria-label="Grid" checked>
      <svg class="radio-layout__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></svg>
    </label>
    <label class="radio-layout__option">
      <input class="radio-layout__input" type="radio" name="radio-layout" value="list" aria-label="List">
      <svg class="radio-layout__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1.5" /><rect x="3" y="10" width="18" height="4" rx="1.5" /><rect x="3" y="16" width="18" height="4" rx="1.5" /></svg>
    </label>
    <label class="radio-layout__option">
      <input class="radio-layout__input" type="radio" name="radio-layout" value="feature" aria-label="Feature">
      <svg class="radio-layout__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="10" rx="1.5" /><rect x="3" y="16" width="5" height="5" rx="1" /><rect x="9.5" y="16" width="5" height="5" rx="1" /><rect x="16" y="16" width="5" height="5" rx="1" /></svg>
    </label>
  </div>
</div>
